<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Lab 5 — Logistic Regression & Softmax</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg-dark:#020617;--panel:rgba(15,23,42,.7);--border:rgba(255,255,255,.08);--accent:#2dd4bf}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:#e2e8f0;overflow:hidden}
.font-mono{font-family:'JetBrains Mono',monospace}
.glass{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 8px 32px 0 rgba(0,0,0,.5)}
input[type=range]{-webkit-appearance:none;background:transparent;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;background:var(--accent);border-radius:50%;margin-top:-5px;box-shadow:0 0 15px var(--accent)}
input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:#334155;border-radius:2px}
.nav-item{transition:all .3s;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:linear-gradient(90deg,rgba(45,212,191,.1),transparent);border-left:2px solid var(--accent);color:#fff}
.glow-text{text-shadow:0 0 30px rgba(45,212,191,.3)}
.btn-primary{background:linear-gradient(135deg,#0d9488,#0891b2);transition:all .3s}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.fade-in{animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="flex h-screen w-screen selection:bg-teal-500 selection:text-black">

<nav class="w-80 glass flex flex-col z-20 border-r border-white/5 flex-shrink-0">
  <div class="p-6 border-b border-white/5 bg-gradient-to-b from-white/5 to-transparent">
    <h1 class="text-xl font-black tracking-tight flex items-center gap-2 text-white">
      <i class="fa-solid fa-wave-square text-teal-400"></i>
      ML <span class="text-teal-400">Lab 5</span>
    </h1>
    <p class="text-[10px] font-mono text-slate-500 mt-2 uppercase tracking-widest pl-7">Logistic Regression &amp; Softmax</p>
  </div>
  <div class="flex-1 overflow-y-auto py-4 space-y-1">
    <button onclick="App.load('sigmoid')" id="nav-sigmoid" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-teal-400 transition-colors">1. The Sigmoid</span>
        <i class="fa-solid fa-s text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Score → probability</div>
    </button>
    <button onclick="App.load('loss')" id="nav-loss" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-amber-400 transition-colors">2. Cross-Entropy Loss</span>
        <i class="fa-solid fa-fire text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Confidence has a price</div>
    </button>
    <button onclick="App.load('boundary')" id="nav-boundary" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-rose-400 transition-colors">3. Train a Classifier</span>
        <i class="fa-solid fa-draw-polygon text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Live decision boundary</div>
    </button>
    <button onclick="App.load('softmax')" id="nav-softmax" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-purple-400 transition-colors">4. Softmax Playground</span>
        <i class="fa-solid fa-chart-column text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Multiclass probabilities</div>
    </button>
  </div>
  <div id="explain" class="p-5 border-t border-white/5 text-[12px] leading-relaxed text-slate-400 max-h-52 overflow-y-auto"></div>
  <div id="controls" class="p-6 bg-black/40 border-t border-white/5 min-h-[170px]"></div>
</nav>

<main class="flex-1 relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-black to-black">
  <canvas id="viz" class="w-full h-full block"></canvas>
  <div class="absolute top-8 left-8 pointer-events-none z-10">
    <h2 id="hud-title" class="text-4xl font-black text-white tracking-tighter glow-text">INIT</h2>
    <div class="flex items-center gap-2 mt-2 bg-black/50 px-3 py-1.5 rounded-full border border-white/10 w-fit">
      <div class="h-2 w-2 rounded-full bg-teal-500 animate-pulse"></div>
      <span id="hud-desc" class="text-xs font-mono text-teal-200 tracking-wider">LOADING</span>
    </div>
  </div>
  <div class="absolute bottom-8 left-8 glass p-5 rounded-lg min-w-[250px] z-10 border-l-4 border-teal-500">
    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
      <i class="fa-solid fa-wave-square text-teal-400 text-xs"></i>
      <span class="text-xs font-bold text-slate-200 uppercase tracking-widest">Live Metrics</span>
    </div>
    <div id="stats-body" class="space-y-2 font-mono text-xs text-slate-300"></div>
  </div>
</main>

<script>
'use strict';
const App = (() => {
  const canvas = document.getElementById('viz'), ctx = canvas.getContext('2d');
  const hudTitle = document.getElementById('hud-title'), hudDesc = document.getElementById('hud-desc');
  const controls = document.getElementById('controls'), explain = document.getElementById('explain'), statsBody = document.getElementById('stats-body');
  let W, H, mode = null;
  function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  window.addEventListener('resize', resize);
  function rnd(seed){ let s=seed; return ()=> (s=(s*16807)%2147483647)/2147483647; }
  const sig = z => 1/(1+Math.exp(-z));

  /* ============ MODULE 1: SIGMOID ============ */
  const sg = { w: 1, b: 0, pts: [] };
  function sgInit(){
    const r = rnd(15); sg.pts = [];
    for (let i=0;i<12;i++) sg.pts.push({ x: -4.5 + r()*4, y: 0 });
    for (let i=0;i<12;i++) sg.pts.push({ x: 0.5 + r()*4, y: 1 });
  }
  function sgDraw(){
    ctx.clearRect(0,0,W,H);
    const X = z => W*0.1 + (z+6)/12*(W*0.8);
    const Y = p => H*0.78 - p*(H*0.55);
    // axes
    ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(-6), Y(0)); ctx.lineTo(X(6), Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(-6), Y(1)); ctx.lineTo(X(6), Y(1)); ctx.stroke();
    ctx.font='11px JetBrains Mono, monospace'; ctx.fillStyle='#475569'; ctx.textAlign='right';
    ctx.fillText('p=0', X(-6)-8, Y(0)+4); ctx.fillText('p=1', X(-6)-8, Y(1)+4);
    // 0.5 threshold
    ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(251,191,36,.4)';
    ctx.beginPath(); ctx.moveTo(X(-6), Y(0.5)); ctx.lineTo(X(6), Y(0.5)); ctx.stroke(); ctx.setLineDash([]);
    // decision point where wx+b=0
    const xd = -sg.b/Math.max(1e-6, sg.w);
    if (xd > -6 && xd < 6){
      ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(251,113,133,.55)';
      ctx.beginPath(); ctx.moveTo(X(xd), Y(0)); ctx.lineTo(X(xd), Y(1.06)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#fb7185'; ctx.textAlign='center';
      ctx.fillText('boundary: wx+b=0', X(xd), Y(1.06)-8);
    }
    // sigmoid curve
    ctx.strokeStyle='#2dd4bf'; ctx.lineWidth=3; ctx.shadowColor='#2dd4bf'; ctx.shadowBlur=8; ctx.beginPath();
    for(let i=0;i<=240;i++){ const x=-6+i/20; const p=sig(sg.w*x+sg.b); i?ctx.lineTo(X(x),Y(p)):ctx.moveTo(X(x),Y(p)); }
    ctx.stroke(); ctx.shadowBlur=0;
    // data points on p=0/p=1 rails with their predicted prob
    let loss = 0;
    sg.pts.forEach(p => {
      const prob = sig(sg.w*p.x+sg.b);
      loss += -(p.y*Math.log(prob+1e-12)+(1-p.y)*Math.log(1-prob+1e-12));
      const col = p.y ? '#fbbf24' : '#38bdf8';
      ctx.strokeStyle='rgba(148,163,184,.25)';
      ctx.beginPath(); ctx.moveTo(X(p.x), Y(p.y)); ctx.lineTo(X(p.x), Y(prob)); ctx.stroke();
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 6, 0, 7); ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,.65)';
      ctx.beginPath(); ctx.arc(X(p.x), Y(prob), 3, 0, 7); ctx.fill();
    });
    loss /= sg.pts.length;
    ctx.fillStyle='#64748b'; ctx.textAlign='center'; ctx.font='12px JetBrains Mono, monospace';
    ctx.fillText('p(y=1|x) = σ(wx + b) — steepness w, shift b', W/2, H*0.92);
    stats([['w (steepness)', sg.w.toFixed(2)], ['b (shift)', sg.b.toFixed(2)], ['Boundary x', (-sg.b/Math.max(1e-6,sg.w)).toFixed(2)], ['Avg log loss', loss.toFixed(3)]]);
  }

  /* ============ MODULE 2: LOSS ============ */
  const lo = { p: 0.7 };
  function loDraw(){
    ctx.clearRect(0,0,W,H);
    const X = p => W*0.12 + p*(W*0.76);
    const Y = l => H*0.82 - Math.min(1, l/5)*(H*0.6);
    ctx.strokeStyle='rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(0)); ctx.stroke();
    // curves
    [['#2dd4bf', p=>-Math.log(p+1e-9), 'true class y=1: loss = −log(p)'],
     ['#fb7185', p=>-Math.log(1-p+1e-9), 'true class y=0: loss = −log(1−p)']].forEach(([col,f,lab],k)=>{
      ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath();
      for(let i=1;i<240;i++){ const p=i/240; const Xp=X(p), Yp=Y(f(p)); i>1?ctx.lineTo(Xp,Yp):ctx.moveTo(Xp,Yp); }
      ctx.stroke();
      ctx.fillStyle=col; ctx.font='12px JetBrains Mono, monospace'; ctx.textAlign='left';
      ctx.fillText(lab, W*0.14, H*0.14+k*20);
    });
    // marker at chosen p
    const p = lo.p;
    [['#2dd4bf', -Math.log(p+1e-9)], ['#fb7185', -Math.log(1-p+1e-9)]].forEach(([col, l])=>{
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X(p), Y(l), 7, 0, 7); ctx.fill();
      ctx.fillStyle='#f8fafc'; ctx.font='bold 12px JetBrains Mono, monospace'; ctx.textAlign='left';
      ctx.fillText(l.toFixed(2), X(p)+12, Y(l));
    });
    ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.moveTo(X(p), Y(0)); ctx.lineTo(X(p), H*0.16); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#64748b'; ctx.textAlign='center'; ctx.font='12px JetBrains Mono, monospace';
    ctx.fillText('predicted probability p(y=1|x) →', W/2, H*0.9);
    const verdict = p>0.95? 'confident — cheap if right, BRUTAL if wrong' : p<0.05 ? 'confident — cheap if right, BRUTAL if wrong' : p>0.4&&p<0.6 ? 'hedging — moderate loss either way' : 'leaning';
    stats([['p', p.toFixed(2)], ['loss if y=1', (-Math.log(p+1e-9)).toFixed(3)], ['loss if y=0', (-Math.log(1-p+1e-9)).toFixed(3)], ['Verdict', verdict]]);
  }

  /* ============ MODULE 3: 2D BOUNDARY ============ */
  const bd = { pts: [], w: [0,0,0], running: false, iter: 0, addClass: 1, lr: 0.5 };
  function bdInit(){
    const r = rnd(31); bd.pts = [];
    for(let i=0;i<30;i++) bd.pts.push({ x: 0.30+ (r()-.5)*0.34, y: 0.36+(r()-.5)*0.36, c: 0 });
    for(let i=0;i<30;i++) bd.pts.push({ x: 0.68+ (r()-.5)*0.34, y: 0.66+(r()-.5)*0.36, c: 1 });
    bd.w = [0.01, 0.01, 0]; bd.iter = 0; bd.running = false;
  }
  function bdStep(){
    let g0=0,g1=0,g2=0;
    bd.pts.forEach(p=>{
      const prob = sig(bd.w[0]*p.x + bd.w[1]*p.y + bd.w[2]);
      const e = prob - p.c;
      g0 += e*p.x; g1 += e*p.y; g2 += e;
    });
    const n = bd.pts.length;
    bd.w[0] -= bd.lr*g0/n*4; bd.w[1] -= bd.lr*g1/n*4; bd.w[2] -= bd.lr*g2/n*4;
    bd.iter++;
  }
  function bdDraw(){
    ctx.clearRect(0,0,W,H);
    if (bd.running) for(let s=0;s<4;s++) bdStep();
    // probability heatmap
    const res=70;
    for(let i=0;i<res;i++) for(let j=0;j<res;j++){
      const x=i/res, y=j/res;
      const p=sig(bd.w[0]*x+bd.w[1]*y+bd.w[2]);
      const t = p; // 0 → blue-ish teal, 1 → amber
      ctx.fillStyle='rgba('+Math.round(45+206*t)+','+Math.round(212-21*t)+','+Math.round(191-155*t)+','+(0.07+0.16*Math.abs(t-0.5)*2)+')';
      ctx.fillRect(x*W, y*H, W/res+1, H/res+1);
    }
    // 0.5 boundary
    if (Math.abs(bd.w[1])>1e-6){
      ctx.strokeStyle='#f8fafc'; ctx.lineWidth=2.4; ctx.setLineDash([9,6]); ctx.beginPath();
      const yAt = x => -(bd.w[2]+bd.w[0]*x)/bd.w[1];
      ctx.moveTo(0, yAt(0)*H); ctx.lineTo(W, yAt(1)*H); ctx.stroke(); ctx.setLineDash([]);
    }
    let loss=0, correct=0;
    bd.pts.forEach(p=>{
      const prob=sig(bd.w[0]*p.x+bd.w[1]*p.y+bd.w[2]);
      loss += -(p.c*Math.log(prob+1e-12)+(1-p.c)*Math.log(1-prob+1e-12));
      if ((prob>.5?1:0)===p.c) correct++;
      const col=p.c?'#fbbf24':'#2dd4bf';
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=7;
      ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 6, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    });
    ctx.font='12px JetBrains Mono, monospace'; ctx.fillStyle='#64748b'; ctx.textAlign='left';
    ctx.fillText('click canvas to drop a point of the selected class', 20, H-18);
    stats([['Iterations', bd.iter], ['Log loss', (loss/bd.pts.length).toFixed(4)], ['Accuracy', (correct/bd.pts.length*100).toFixed(1)+'%'], ['w', bd.w.map(v=>v.toFixed(1)).join(', ')]]);
  }
  canvas.addEventListener('click', e=>{
    if (mode!=='boundary') return;
    const rect=canvas.getBoundingClientRect();
    bd.pts.push({ x:(e.clientX-rect.left)/W, y:(e.clientY-rect.top)/H, c: bd.addClass });
  });

  /* ============ MODULE 4: SOFTMAX ============ */
  const sm = { z: [2.0, 1.0, 0.2], T: 1 };
  const SM_COL = ['#2dd4bf', '#fbbf24', '#c084fc'];
  const SM_LAB = ['cat', 'dog', 'bird'];
  function smDraw(){
    ctx.clearRect(0,0,W,H);
    const ez = sm.z.map(z=>Math.exp(z/sm.T));
    const S = ez.reduce((a,b)=>a+b,0);
    const p = ez.map(v=>v/S);
    const bw = W*0.14, gap = W*0.08, ox = (W - 3*bw - 2*gap)/2, baseY = H*0.72, maxH = H*0.45;
    p.forEach((pi,i)=>{
      const x = ox + i*(bw+gap);
      // score bar (thin, below)
      ctx.fillStyle='rgba(148,163,184,.25)';
      const zh = sm.z[i]/4*60;
      ctx.fillRect(x+bw/2-18, baseY+46, 36, -zh);
      ctx.fillStyle='#64748b'; ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='center';
      ctx.fillText('z='+sm.z[i].toFixed(1), x+bw/2, baseY+64);
      // prob bar
      ctx.fillStyle=SM_COL[i]; ctx.shadowColor=SM_COL[i]; ctx.shadowBlur=16;
      ctx.fillRect(x, baseY, bw, -p[i]*maxH); ctx.shadowBlur=0;
      ctx.fillStyle='#f8fafc'; ctx.font='bold 18px JetBrains Mono, monospace';
      ctx.fillText((p[i]*100).toFixed(1)+'%', x+bw/2, baseY - p[i]*maxH - 14);
      ctx.font='13px Inter, sans-serif'; ctx.fillStyle='#cbd5e1';
      ctx.fillText(SM_LAB[i], x+bw/2, baseY+24);
    });
    ctx.fillStyle='#64748b'; ctx.font='12px JetBrains Mono, monospace'; ctx.textAlign='center';
    ctx.fillText('P(y=k|x) = exp(z_k/T) / Σ exp(z_j/T)   ·   probabilities always sum to 1', W/2, H*0.9);
    const ent = -p.reduce((s,v)=>s+v*Math.log2(v+1e-12),0);
    stats([['Σ p', p.reduce((a,b)=>a+b,0).toFixed(3)], ['Prediction', SM_LAB[p.indexOf(Math.max(...p))]], ['Entropy', ent.toFixed(3)+' bits'], ['Temp T', sm.T.toFixed(1)], ['Regime', sm.T<0.5?'≈ argmax (sharp)':sm.T>3?'≈ uniform (flat)':'balanced']]);
  }

  function stats(rows){ statsBody.innerHTML = rows.map(([k,v]) => '<div class="flex justify-between gap-6"><span class="text-slate-500">'+k+'</span><span class="text-teal-300 font-bold">'+v+'</span></div>').join(''); }

  const MODULES = {
    sigmoid: {
      title: 'THE SIGMOID', desc: 'σ(z) = 1 / (1 + e⁻ᶻ)',
      explain: '<b class="text-slate-200">Linear score in, probability out.</b> Blue points are class 0, amber are class 1 — their thin grey stems show the probability the current model assigns them. Increase w to sharpen the S; move b to slide the boundary. The red dashed line (p = 0.5) is where wx + b = 0.',
      init: sgInit, draw: sgDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">Steepness w: <span id="sg-w" class="text-teal-300 font-bold">1.0</span></label>' +
        '<input type="range" min="-30" max="60" value="10" class="mt-1 mb-3" oninput="App.act(\'sgW\', this.value)">' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase">Shift b: <span id="sg-b" class="text-teal-300 font-bold">0.0</span></label>' +
        '<input type="range" min="-40" max="40" value="0" class="mt-1" oninput="App.act(\'sgB\', this.value)">'
    },
    loss: {
      title: 'CROSS-ENTROPY', desc: '−[y·log p + (1−y)·log(1−p)]',
      explain: '<b class="text-slate-200">Why not squared error? Because confidence must be punished when wrong.</b> Slide p: if the true class is 1 (teal curve) the loss vanishes as p→1 but explodes toward ∞ as p→0. A model that says "99.9% sure" and is wrong pays enormously — exactly the incentive we want.',
      init: ()=>{}, draw: loDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">Predicted p(y=1|x): <span id="lo-p" class="text-teal-300 font-bold">0.70</span></label>' +
        '<input type="range" min="1" max="99" value="70" class="mt-1" oninput="App.act(\'loP\', this.value)">'
    },
    boundary: {
      title: 'TRAIN A CLASSIFIER', desc: 'GRADIENT (1/n)Xᵀ(p − y)',
      explain: '<b class="text-slate-200">Watch logistic regression learn.</b> The heat shows p(y=1|x) at every location; the white dashed line is the 0.5 boundary. Press Train — the gradient has the beautiful form Xᵀ(p − y): error times input. Click to add tricky points (choose the class below) and see the boundary adapt.',
      init: bdInit, draw: bdDraw,
      controls: '<button onclick="App.act(\'bdRun\')" id="btn-bd" class="btn-primary w-full py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-play mr-2"></i>Train</button>' +
        '<div class="flex gap-2 mt-2">' +
        '<button onclick="App.act(\'bdCls\',0)" id="cls-0" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition" style="color:#2dd4bf">+ class 0</button>' +
        '<button onclick="App.act(\'bdCls\',1)" id="cls-1" class="flex-1 py-2 rounded-lg text-xs font-bold transition" style="color:#fbbf24;background:rgba(251,191,36,.15)">+ class 1</button></div>' +
        '<button onclick="App.act(\'bdReset\')" class="w-full mt-2 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Reset</button>'
    },
    softmax: {
      title: 'SOFTMAX', desc: 'K CLASSES, ONE DISTRIBUTION',
      explain: '<b class="text-slate-200">Softmax turns K arbitrary scores into probabilities that sum to 1.</b> Raise one logit and watch the others deflate — it\'s a competition. Temperature T divides the logits: low T → nearly one-hot argmax; high T → nearly uniform. Grey bars are raw scores z; coloured bars the resulting distribution.',
      init: ()=>{}, draw: smDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">z₁ cat: <span id="sm-0" class="text-teal-300 font-bold">2.0</span></label>' +
        '<input type="range" min="-30" max="40" value="20" class="mt-1 mb-2" oninput="App.act(\'smZ\', [0,this.value])">' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase">z₂ dog: <span id="sm-1" class="text-teal-300 font-bold">1.0</span></label>' +
        '<input type="range" min="-30" max="40" value="10" class="mt-1 mb-2" oninput="App.act(\'smZ\', [1,this.value])">' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase">z₃ bird: <span id="sm-2" class="text-teal-300 font-bold">0.2</span></label>' +
        '<input type="range" min="-30" max="40" value="2" class="mt-1 mb-2" oninput="App.act(\'smZ\', [2,this.value])">' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase">Temperature T: <span id="sm-t" class="text-teal-300 font-bold">1.0</span></label>' +
        '<input type="range" min="2" max="50" value="10" class="mt-1" oninput="App.act(\'smT\', this.value)">'
    },
  };

  function act(what, val){
    if (what==='sgW'){ sg.w=+val/10; document.getElementById('sg-w').textContent=sg.w.toFixed(1); }
    if (what==='sgB'){ sg.b=+val/10; document.getElementById('sg-b').textContent=sg.b.toFixed(1); }
    if (what==='loP'){ lo.p=+val/100; document.getElementById('lo-p').textContent=lo.p.toFixed(2); }
    if (what==='bdRun'){ bd.running=!bd.running; document.getElementById('btn-bd').innerHTML = bd.running?'<i class="fa-solid fa-pause mr-2"></i>Pause':'<i class="fa-solid fa-play mr-2"></i>Train'; }
    if (what==='bdCls'){ bd.addClass=+val;
      document.getElementById('cls-0').style.background = val==0?'rgba(45,212,191,.15)':'rgba(255,255,255,.05)';
      document.getElementById('cls-1').style.background = val==1?'rgba(251,191,36,.15)':'rgba(255,255,255,.05)'; }
    if (what==='bdReset') bdInit();
    if (what==='smZ'){ const [i,v]=val; sm.z[i]=+v/10; document.getElementById('sm-'+i).textContent=sm.z[i].toFixed(1); }
    if (what==='smT'){ sm.T=+val/10; document.getElementById('sm-t').textContent=sm.T.toFixed(1); }
  }

  function load(m){
    mode=m;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.getElementById('nav-'+m).classList.add('active');
    const M=MODULES[m];
    hudTitle.textContent=M.title; hudDesc.textContent=M.desc;
    controls.innerHTML='<div class="fade-in">'+M.controls+'</div>';
    explain.innerHTML='<div class="fade-in">'+M.explain+'</div>';
    M.init();
  }
  function loop(){ if (mode) MODULES[mode].draw(); requestAnimationFrame(loop); }
  resize();
  return { load, act, start(){ load('sigmoid'); loop(); } };
})();
App.start();
</script>
</body>
</html>
