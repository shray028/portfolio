<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Lab 12 — Model Evaluation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg-dark:#020617;--panel:rgba(15,23,42,.7);--border:rgba(255,255,255,.08);--accent:#2dd4bf}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:#e2e8f0;overflow:hidden}
.font-mono{font-family:'JetBrains Mono',monospace}
.glass{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 8px 32px 0 rgba(0,0,0,.5)}
input[type=range]{-webkit-appearance:none;background:transparent;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;background:var(--accent);border-radius:50%;margin-top:-5px;box-shadow:0 0 15px var(--accent)}
input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:#334155;border-radius:2px}
.nav-item{transition:all .3s;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:linear-gradient(90deg,rgba(45,212,191,.1),transparent);border-left:2px solid var(--accent);color:#fff}
.glow-text{text-shadow:0 0 30px rgba(45,212,191,.3)}
.btn-primary{background:linear-gradient(135deg,#0d9488,#0891b2);transition:all .3s}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.fade-in{animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="flex h-screen w-screen selection:bg-teal-500 selection:text-black">

<nav class="w-80 glass flex flex-col z-20 border-r border-white/5 flex-shrink-0">
  <div class="p-6 border-b border-white/5 bg-gradient-to-b from-white/5 to-transparent">
    <h1 class="text-xl font-black tracking-tight flex items-center gap-2 text-white">
      <i class="fa-solid fa-gauge-high text-teal-400"></i>
      ML <span class="text-teal-400">Lab 12</span>
    </h1>
    <p class="text-[10px] font-mono text-slate-500 mt-2 uppercase tracking-widest pl-7">Model Evaluation</p>
  </div>
  <div class="flex-1 overflow-y-auto py-4 space-y-1">
    <button onclick="App.load('confusion')" id="nav-confusion" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-teal-400 transition-colors">1. Threshold &amp; Confusion</span>
        <i class="fa-solid fa-table-cells text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Slide the decision line</div>
    </button>
    <button onclick="App.load('roc')" id="nav-roc" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-amber-400 transition-colors">2. ROC &amp; AUC</span>
        <i class="fa-solid fa-chart-area text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">All thresholds at once</div>
    </button>
    <button onclick="App.load('pr')" id="nav-pr" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-rose-400 transition-colors">3. Precision–Recall</span>
        <i class="fa-solid fa-scale-unbalanced text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Truth under imbalance</div>
    </button>
    <button onclick="App.load('cv')" id="nav-cv" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-purple-400 transition-colors">4. Cross-Validation</span>
        <i class="fa-solid fa-layer-group text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">k folds, honest estimates</div>
    </button>
  </div>
  <div id="explain" class="p-5 border-t border-white/5 text-[12px] leading-relaxed text-slate-400 max-h-52 overflow-y-auto"></div>
  <div id="controls" class="p-6 bg-black/40 border-t border-white/5 min-h-[160px]"></div>
</nav>

<main class="flex-1 relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-black to-black">
  <canvas id="viz" class="w-full h-full block"></canvas>
  <div class="absolute top-8 left-8 pointer-events-none z-10">
    <h2 id="hud-title" class="text-4xl font-black text-white tracking-tighter glow-text">INIT</h2>
    <div class="flex items-center gap-2 mt-2 bg-black/50 px-3 py-1.5 rounded-full border border-white/10 w-fit">
      <div class="h-2 w-2 rounded-full bg-teal-500 animate-pulse"></div>
      <span id="hud-desc" class="text-xs font-mono text-teal-200 tracking-wider">LOADING</span>
    </div>
  </div>
  <div class="absolute bottom-8 left-8 glass p-5 rounded-lg min-w-[250px] z-10 border-l-4 border-teal-500">
    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
      <i class="fa-solid fa-wave-square text-teal-400 text-xs"></i>
      <span class="text-xs font-bold text-slate-200 uppercase tracking-widest">Live Metrics</span>
    </div>
    <div id="stats-body" class="space-y-2 font-mono text-xs text-slate-300"></div>
  </div>
</main>

<script>
'use strict';
const App = (() => {
  const canvas = document.getElementById('viz'), ctx = canvas.getContext('2d');
  const hudTitle = document.getElementById('hud-title'), hudDesc = document.getElementById('hud-desc');
  const controls = document.getElementById('controls'), explain = document.getElementById('explain'), statsBody = document.getElementById('stats-body');
  let W, H, mode = null;
  function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  window.addEventListener('resize', resize);
  function rnd(seed){ let s=seed; return ()=> (s=(s*16807)%2147483647)/2147483647; }
  function gauss(r){ let u=0; for(let i=0;i<6;i++) u+=r(); return (u-3)/1.4; }

  /* ---- shared scored population ---- */
  const st = { thr: 0.5, sep: 1.0, posFrac: 0.5, scores: [] };
  function makeScores(){
    const r = rnd(321); st.scores=[];
    const N = 400, nPos = Math.round(N*st.posFrac);
    for(let i=0;i<nPos;i++) st.scores.push({ y:1, s: clamp01(0.5 + st.sep*0.18 + gauss(r)*0.16) });
    for(let i=0;i<N-nPos;i++) st.scores.push({ y:0, s: clamp01(0.5 - st.sep*0.18 + gauss(r)*0.16) });
  }
  function clamp01(v){ return Math.min(0.999, Math.max(0.001, v)); }
  function confusion(thr){
    let TP=0,FP=0,TN=0,FN=0;
    st.scores.forEach(p=>{
      if (p.s>=thr) p.y? TP++ : FP++;
      else p.y? FN++ : TN++;
    });
    return {TP,FP,TN,FN};
  }
  function drawHists(x0, w, y0, h, thr){
    // two histograms of scores
    const bins = 40, hp = new Array(bins).fill(0), hn = new Array(bins).fill(0);
    st.scores.forEach(p=>{ const b=Math.min(bins-1,Math.floor(p.s*bins)); p.y?hp[b]++:hn[b]++; });
    const mx = Math.max(...hp, ...hn);
    for(let b=0;b<bins;b++){
      const X = x0 + b/bins*w, bw = w/bins-1;
      ctx.fillStyle='rgba(56,189,248,.55)';
      ctx.fillRect(X, y0+h, bw, -hn[b]/mx*h*0.9);
      ctx.fillStyle='rgba(251,113,133,.55)';
      ctx.fillRect(X, y0+h, bw, -hp[b]/mx*h*0.9);
    }
    // threshold line
    const tx = x0 + thr*w;
    ctx.strokeStyle='#f8fafc'; ctx.lineWidth=2.5; ctx.setLineDash([7,5]);
    ctx.beginPath(); ctx.moveTo(tx, y0-10); ctx.lineTo(tx, y0+h); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#f8fafc'; ctx.font='bold 12px JetBrains Mono, monospace'; ctx.textAlign='center';
    ctx.fillText('threshold '+thr.toFixed(2), tx, y0-18);
    ctx.fillStyle='#38bdf8'; ctx.textAlign='left'; ctx.font='11px JetBrains Mono, monospace';
    ctx.fillText('■ negatives', x0, y0+h+20);
    ctx.fillStyle='#fb7185'; ctx.fillText('■ positives', x0+90, y0+h+20);
    ctx.fillStyle='#64748b'; ctx.fillText('model score →', x0+w-100, y0+h+20);
  }

  /* ============ MODULE 1: CONFUSION ============ */
  function cfDraw(){
    ctx.clearRect(0,0,W,H);
    drawHists(W*0.07, W*0.5, H*0.2, H*0.42, st.thr);
    const {TP,FP,TN,FN} = confusion(st.thr);
    // confusion matrix
    const mx=W*0.66, my=H*0.22, cs=Math.min(W*0.13, H*0.2);
    const cells = [
      { x:0, y:0, v:TP, lab:'TP', col:'rgba(45,212,191,' },
      { x:1, y:0, v:FN, lab:'FN', col:'rgba(251,113,133,' },
      { x:0, y:1, v:FP, lab:'FP', col:'rgba(251,191,36,' },
      { x:1, y:1, v:TN, lab:'TN', col:'rgba(56,189,248,' },
    ];
    const tot=TP+FP+TN+FN;
    cells.forEach(c=>{
      const X=mx+c.x*cs, Y=my+c.y*cs;
      ctx.fillStyle=c.col+(0.15+0.65*c.v/tot)+')';
      ctx.fillRect(X,Y,cs-4,cs-4);
      ctx.fillStyle='#f8fafc'; ctx.font='bold 22px JetBrains Mono, monospace'; ctx.textAlign='center';
      ctx.fillText(c.v, X+cs/2-2, Y+cs/2);
      ctx.font='11px JetBrains Mono, monospace'; ctx.fillStyle='rgba(248,250,252,.75)';
      ctx.fillText(c.lab, X+cs/2-2, Y+cs/2+22);
    });
    ctx.fillStyle='#64748b'; ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='center';
    ctx.fillText('pred +', mx+cs*0.5, my-10); ctx.fillText('pred −', mx+cs*1.5, my-10);
    ctx.save(); ctx.translate(mx-12, my+cs*0.5); ctx.rotate(-Math.PI/2); ctx.fillText('actual +', 0,0); ctx.restore();
    ctx.save(); ctx.translate(mx-12, my+cs*1.5); ctx.rotate(-Math.PI/2); ctx.fillText('actual −', 0,0); ctx.restore();
    const acc=(TP+TN)/tot, prec=TP/(TP+FP||1), rec=TP/(TP+FN||1);
    const f1 = 2*prec*rec/((prec+rec)||1);
    stats([['Accuracy', (acc*100).toFixed(1)+'%'], ['Precision', (prec*100).toFixed(1)+'%'], ['Recall (TPR)', (rec*100).toFixed(1)+'%'], ['F1', f1.toFixed(3)], ['Trade-off', 'thr ↑ precision ↑ recall ↓']]);
  }

  /* ============ MODULE 2: ROC ============ */
  function rocPts(){
    const pts=[];
    for(let i=0;i<=100;i++){
      const {TP,FP,TN,FN} = confusion(i/100);
      pts.push({ fpr: FP/(FP+TN||1), tpr: TP/(TP+FN||1), thr: i/100 });
    }
    return pts;
  }
  function rocDraw(){
    ctx.clearRect(0,0,W,H);
    drawHists(W*0.06, W*0.38, H*0.2, H*0.36, st.thr);
    const gx=W*0.55, gs=Math.min(W*0.36, H*0.62), gy=H*0.16;
    ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.strokeRect(gx,gy,gs,gs);
    // diagonal (random)
    ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(148,163,184,.4)';
    ctx.beginPath(); ctx.moveTo(gx, gy+gs); ctx.lineTo(gx+gs, gy); ctx.stroke(); ctx.setLineDash([]);
    const pts = rocPts();
    // AUC (trapezoid over sorted fpr)
    let auc=0;
    for(let i=1;i<pts.length;i++) auc += (pts[i-1].fpr-pts[i].fpr)*(pts[i].tpr+pts[i-1].tpr)/2;
    // fill under curve
    ctx.fillStyle='rgba(45,212,191,.08)'; ctx.beginPath();
    ctx.moveTo(gx, gy+gs);
    pts.slice().reverse().forEach(p=> ctx.lineTo(gx+p.fpr*gs, gy+gs-p.tpr*gs));
    ctx.lineTo(gx+gs, gy+gs); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#2dd4bf'; ctx.lineWidth=3; ctx.shadowColor='#2dd4bf'; ctx.shadowBlur=8; ctx.beginPath();
    pts.forEach((p,i)=>{ const X=gx+p.fpr*gs, Y=gy+gs-p.tpr*gs; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.stroke(); ctx.shadowBlur=0;
    // current threshold dot
    const {TP,FP,TN,FN} = confusion(st.thr);
    const cf = FP/(FP+TN||1), ct = TP/(TP+FN||1);
    ctx.fillStyle='#f8fafc'; ctx.beginPath(); ctx.arc(gx+cf*gs, gy+gs-ct*gs, 8, 0, 7); ctx.fill();
    ctx.fillStyle='#64748b'; ctx.font='12px JetBrains Mono, monospace'; ctx.textAlign='center';
    ctx.fillText('FPR →', gx+gs/2, gy+gs+26);
    ctx.save(); ctx.translate(gx-16, gy+gs/2); ctx.rotate(-Math.PI/2); ctx.fillText('TPR →', 0, 0); ctx.restore();
    ctx.fillStyle='#2dd4bf'; ctx.font='bold 18px JetBrains Mono, monospace';
    ctx.fillText('AUC = '+auc.toFixed(3), gx+gs*0.62, gy+gs*0.75);
    stats([['Threshold', st.thr.toFixed(2)], ['TPR', ct.toFixed(3)], ['FPR', cf.toFixed(3)], ['AUC', auc.toFixed(3)], ['Separation', st.sep.toFixed(1)]]);
  }

  /* ============ MODULE 3: PRECISION-RECALL ============ */
  function prDraw(){
    ctx.clearRect(0,0,W,H);
    drawHists(W*0.06, W*0.38, H*0.2, H*0.36, st.thr);
    const gx=W*0.55, gs=Math.min(W*0.36, H*0.62), gy=H*0.16;
    ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.strokeRect(gx,gy,gs,gs);
    // baseline = positive fraction
    const base = st.scores.filter(p=>p.y).length/st.scores.length;
    ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(148,163,184,.4)';
    ctx.beginPath(); ctx.moveTo(gx, gy+gs-base*gs); ctx.lineTo(gx+gs, gy+gs-base*gs); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#94a3b8'; ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='left';
    ctx.fillText('random baseline = '+(base*100).toFixed(0)+'% positives', gx+8, gy+gs-base*gs-8);
    // PR curve
    ctx.strokeStyle='#fb7185'; ctx.lineWidth=3; ctx.shadowColor='#fb7185'; ctx.shadowBlur=8; ctx.beginPath();
    let started=false;
    for(let i=0;i<=100;i++){
      const {TP,FP,FN} = confusion(i/100);
      if (TP+FP===0) continue;
      const prec=TP/(TP+FP), rec=TP/(TP+FN||1);
      const X=gx+rec*gs, Y=gy+gs-prec*gs;
      started?ctx.lineTo(X,Y):ctx.moveTo(X,Y); started=true;
    }
    ctx.stroke(); ctx.shadowBlur=0;
    // current point
    const {TP,FP,FN} = confusion(st.thr);
    const cp=TP/(TP+FP||1), cr=TP/(TP+FN||1);
    ctx.fillStyle='#f8fafc'; ctx.beginPath(); ctx.arc(gx+cr*gs, gy+gs-cp*gs, 8, 0, 7); ctx.fill();
    ctx.fillStyle='#64748b'; ctx.font='12px JetBrains Mono, monospace'; ctx.textAlign='center';
    ctx.fillText('Recall →', gx+gs/2, gy+gs+26);
    ctx.save(); ctx.translate(gx-16, gy+gs/2); ctx.rotate(-Math.PI/2); ctx.fillText('Precision →', 0, 0); ctx.restore();
    const f1 = 2*cp*cr/((cp+cr)||1);
    stats([['Pos fraction', (base*100).toFixed(0)+'%'], ['Precision', (cp*100).toFixed(1)+'%'], ['Recall', (cr*100).toFixed(1)+'%'], ['F1', f1.toFixed(3)], ['Why PR?', 'ROC hides class imbalance']]);
  }

  /* ============ MODULE 4: CROSS-VALIDATION ============ */
  const cv = { k: 5, fold: 0, scores: [], anim: 0 };
  function cvInit(){ cv.fold=0; cv.scores=[]; cvGen(); }
  function cvGen(){
    const r = rnd(777+cv.k);
    cv.scores=[];
    for(let f=0;f<cv.k;f++) cv.scores.push(0.78 + (r()-.5)*0.14);
  }
  function cvDraw(){
    ctx.clearRect(0,0,W,H);
    const n = 30, bw = W*0.72/n, bx = W*0.1;
    // draw k rows of the data strip
    for(let f=0; f<cv.k; f++){
      const y = H*0.16 + f*(H*0.5/cv.k);
      const rowH = H*0.5/cv.k*0.66;
      for(let i=0;i<n;i++){
        const foldOf = Math.floor(i/(n/cv.k));
        const isVal = foldOf===f;
        ctx.fillStyle = isVal ? '#fb7185' : 'rgba(45,212,191,.5)';
        if (f<=cv.fold) ctx.fillStyle = isVal ? '#fb7185' : 'rgba(45,212,191,.5)';
        else ctx.fillStyle = isVal ? 'rgba(251,113,133,.25)' : 'rgba(45,212,191,.15)';
        ctx.fillRect(bx+i*bw, y, bw-2, rowH);
      }
      ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='left';
      if (f<=cv.fold && cv.scores[f]!==undefined){
        ctx.fillStyle='#f8fafc';
        ctx.fillText('fold '+(f+1)+'  acc='+(cv.scores[f]*100).toFixed(1)+'%', bx+n*bw+16, y+rowH*0.7);
      } else {
        ctx.fillStyle='#475569';
        ctx.fillText('fold '+(f+1), bx+n*bw+16, y+rowH*0.7);
      }
    }
    ctx.fillStyle='#64748b'; ctx.font='12px JetBrains Mono, monospace'; ctx.textAlign='left';
    ctx.fillText('■ train    ', bx, H*0.72); ctx.fillStyle='#fb7185'; ctx.fillText('        ■ validation (held out)', bx, H*0.72);
    ctx.fillStyle='rgba(45,212,191,.6)'; ctx.fillText('■ train', bx, H*0.72);
    // mean ± std once all folds done
    const done = cv.scores.slice(0, cv.fold+1);
    if (done.length===cv.k){
      const mean = done.reduce((a,b)=>a+b,0)/cv.k;
      const sd = Math.sqrt(done.reduce((s,v)=>s+(v-mean)**2,0)/cv.k);
      ctx.fillStyle='#2dd4bf'; ctx.font='bold 20px JetBrains Mono, monospace';
      ctx.fillText('CV estimate: '+(mean*100).toFixed(1)+'% ± '+(sd*100).toFixed(1)+'%', bx, H*0.82);
      ctx.fillStyle='#64748b'; ctx.font='12px JetBrains Mono, monospace';
      ctx.fillText('every point was validated on exactly once — no data wasted, honest variance too', bx, H*0.86);
    }
    const doneN = Math.min(cv.fold+1, cv.k);
    stats([['Folds k', cv.k], ['Completed', doneN+' / '+cv.k], ['Fold accs', done.map(s=>(s*100).toFixed(0)).join(' ')+'%'], ['Each point', 'trains k−1×, validates 1×'], ['k = n', '= leave-one-out (LOOCV)']]);
  }

  function stats(rows){ statsBody.innerHTML = rows.map(([k,v]) => '<div class="flex justify-between gap-6"><span class="text-slate-500">'+k+'</span><span class="text-teal-300 font-bold">'+v+'</span></div>').join(''); }

  const thrSlider = '<label class="text-[11px] font-mono text-slate-400 uppercase">Decision threshold: <span id="ev-thr" class="text-teal-300 font-bold">0.50</span></label>' +
    '<input type="range" min="1" max="99" value="50" class="mt-1 mb-3" oninput="App.act(\'thr\', this.value)">' +
    '<label class="text-[11px] font-mono text-slate-400 uppercase">Class separation: <span id="ev-sep" class="text-teal-300 font-bold">1.0</span></label>' +
    '<input type="range" min="2" max="25" value="10" class="mt-1 mb-3" oninput="App.act(\'sep\', this.value)">' +
    '<label class="text-[11px] font-mono text-slate-400 uppercase">Positive fraction: <span id="ev-pf" class="text-teal-300 font-bold">50%</span></label>' +
    '<input type="range" min="2" max="50" value="50" class="mt-1" oninput="App.act(\'pf\', this.value)">';

  const MODULES = {
    confusion: {
      title: 'CONFUSION MATRIX', desc: 'ONE THRESHOLD, FOUR FATES',
      explain: '<b class="text-slate-200">A classifier outputs scores; YOU pick the cut-off.</b> Everything right of the white line is called positive. Slide it: precision (how clean are my alarms?) and recall (how many true positives did I catch?) pull in opposite directions. Shrink the positive fraction to 2% and watch accuracy stay flattering while the matrix tells the real story.',
      init: ()=>{ makeScores(); }, draw: cfDraw, controls: thrSlider
    },
    roc: {
      title: 'ROC & AUC', desc: 'SWEEP EVERY THRESHOLD',
      explain: '<b class="text-slate-200">The ROC curve plots TPR vs FPR for every possible threshold at once</b> — the white dot is where your slider sits on it. AUC is the area underneath: the probability a random positive outscores a random negative. Separation 0.2 → coin flip (diagonal). Crank it up and the curve hugs the top-left corner.',
      init: ()=>{ makeScores(); }, draw: rocDraw, controls: thrSlider
    },
    pr: {
      title: 'PRECISION-RECALL', desc: 'THE IMBALANCE-HONEST CURVE',
      explain: '<b class="text-slate-200">Set positives to 2% and compare with the ROC tab:</b> ROC still looks heroic, but the PR curve collapses — because FPR divides false alarms by the huge negative class, hiding them, while precision divides by your own alarms. For fraud, disease, spam: judge on PR, not ROC.',
      init: ()=>{ makeScores(); }, draw: prDraw, controls: thrSlider
    },
    cv: {
      title: 'CROSS-VALIDATION', desc: 'k FOLDS, ZERO WASTE',
      explain: '<b class="text-slate-200">One train/test split gives one noisy number.</b> k-fold CV rotates the held-out block so every sample is validated on exactly once, yielding a mean <i>and</i> a standard deviation — an honest estimate with error bars. Use it to compare models or tune hyper-parameters without ever touching the final test set.',
      init: cvInit, draw: cvDraw,
      controls: '<button onclick="App.act(\'cvNext\')" class="btn-primary w-full py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-forward-step mr-2"></i>Run next fold</button>' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase mt-3 block">Folds k: <span id="cv-k" class="text-teal-300 font-bold">5</span></label>' +
        '<input type="range" min="2" max="10" value="5" class="mt-1 mb-2" oninput="App.act(\'cvK\', this.value)">' +
        '<button onclick="App.act(\'cvReset\')" class="w-full py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Reset</button>'
    },
  };

  function act(what, val){
    if (what==='thr'){ st.thr=+val/100; document.getElementById('ev-thr').textContent=st.thr.toFixed(2); }
    if (what==='sep'){ st.sep=+val/10; document.getElementById('ev-sep').textContent=st.sep.toFixed(1); makeScores(); }
    if (what==='pf'){ st.posFrac=+val/100; document.getElementById('ev-pf').textContent=val+'%'; makeScores(); }
    if (what==='cvNext'){ cv.fold=Math.min(cv.k-1, cv.fold+1); }
    if (what==='cvK'){ cv.k=+val; document.getElementById('cv-k').textContent=val; cvInit(); }
    if (what==='cvReset') cvInit();
  }

  function load(m){
    mode=m;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.getElementById('nav-'+m).classList.add('active');
    const M=MODULES[m];
    hudTitle.textContent=M.title; hudDesc.textContent=M.desc;
    controls.innerHTML='<div class="fade-in">'+M.controls+'</div>';
    explain.innerHTML='<div class="fade-in">'+M.explain+'</div>';
    M.init();
  }
  function loop(){ if (mode) MODULES[mode].draw(); requestAnimationFrame(loop); }
  resize();
  return { load, act, start(){ const h=location.hash.slice(1); load(MODULES[h] ? h : 'confusion'); window.addEventListener('hashchange', ()=>{ const k=location.hash.slice(1); if (MODULES[k] && k!==mode) load(k); }); loop(); } };
})();
App.start();
</script>
</body>
</html>
