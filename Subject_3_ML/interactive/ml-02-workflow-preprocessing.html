<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Lab 2 — Workflow, Preprocessing & Imbalance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg-dark:#020617;--panel:rgba(15,23,42,.7);--border:rgba(255,255,255,.08);--accent:#2dd4bf}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:#e2e8f0;overflow:hidden}
.font-mono{font-family:'JetBrains Mono',monospace}
.glass{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 8px 32px 0 rgba(0,0,0,.5)}
input[type=range]{-webkit-appearance:none;background:transparent;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;background:var(--accent);border-radius:50%;margin-top:-5px;box-shadow:0 0 15px var(--accent)}
input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:#334155;border-radius:2px}
.nav-item{transition:all .3s;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:linear-gradient(90deg,rgba(45,212,191,.1),transparent);border-left:2px solid var(--accent);color:#fff}
.glow-text{text-shadow:0 0 30px rgba(45,212,191,.3)}
.btn-primary{background:linear-gradient(135deg,#0d9488,#0891b2);transition:all .3s}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.fade-in{animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="flex h-screen w-screen selection:bg-teal-500 selection:text-black">

<nav class="w-80 glass flex flex-col z-20 border-r border-white/5 flex-shrink-0">
  <div class="p-6 border-b border-white/5 bg-gradient-to-b from-white/5 to-transparent">
    <h1 class="text-xl font-black tracking-tight flex items-center gap-2 text-white">
      <i class="fa-solid fa-diagram-project text-teal-400"></i>
      ML <span class="text-teal-400">Lab 2</span>
    </h1>
    <p class="text-[10px] font-mono text-slate-500 mt-2 uppercase tracking-widest pl-7">Workflow &amp; Data Pipeline</p>
  </div>
  <div class="flex-1 overflow-y-auto py-4 space-y-1">
    <button onclick="App.load('split')" id="nav-split" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-teal-400 transition-colors">1. Train / Val / Test Split</span>
        <i class="fa-solid fa-scissors text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Why we hold data out</div>
    </button>
    <button onclick="App.load('scale')" id="nav-scale" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-amber-400 transition-colors">2. Standardisation</span>
        <i class="fa-solid fa-ruler-combined text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">x′ = (x − μ)/σ</div>
    </button>
    <button onclick="App.load('imbalance')" id="nav-imbalance" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-rose-400 transition-colors">3. Class Imbalance</span>
        <i class="fa-solid fa-scale-unbalanced text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Accuracy lies · threshold tuning</div>
    </button>
  </div>
  <div id="explain" class="p-5 border-t border-white/5 text-[12px] leading-relaxed text-slate-400 max-h-52 overflow-y-auto"></div>
  <div id="controls" class="p-6 bg-black/40 border-t border-white/5 min-h-[150px]"></div>
</nav>

<main class="flex-1 relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-black to-black">
  <canvas id="viz" class="w-full h-full block"></canvas>
  <div class="absolute top-8 left-8 pointer-events-none z-10">
    <h2 id="hud-title" class="text-4xl font-black text-white tracking-tighter glow-text">INIT</h2>
    <div class="flex items-center gap-2 mt-2 bg-black/50 px-3 py-1.5 rounded-full border border-white/10 w-fit">
      <div class="h-2 w-2 rounded-full bg-teal-500 animate-pulse"></div>
      <span id="hud-desc" class="text-xs font-mono text-teal-200 tracking-wider">LOADING</span>
    </div>
  </div>
  <div class="absolute bottom-8 left-8 glass p-5 rounded-lg min-w-[250px] z-10 border-l-4 border-teal-500">
    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
      <i class="fa-solid fa-wave-square text-teal-400 text-xs"></i>
      <span class="text-xs font-bold text-slate-200 uppercase tracking-widest">Live Metrics</span>
    </div>
    <div id="stats-body" class="space-y-2 font-mono text-xs text-slate-300"></div>
  </div>
</main>

<script>
'use strict';
const App = (() => {
  const canvas = document.getElementById('viz'), ctx = canvas.getContext('2d');
  const hudTitle = document.getElementById('hud-title'), hudDesc = document.getElementById('hud-desc');
  const controls = document.getElementById('controls'), explain = document.getElementById('explain'), statsBody = document.getElementById('stats-body');
  let W, H, mode = null, frame = 0;
  function resize(){ W = canvas.clientWidth; H = canvas.clientHeight; canvas.width = W*devicePixelRatio; canvas.height = H*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  window.addEventListener('resize', resize);
  function rnd(seed){ let s=seed; return ()=> (s = (s*16807)%2147483647)/2147483647; }
  function gauss(r){ return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.283*r()); }

  /* ============ MODULE 1: SPLIT ============ */
  const sp = { n: 120, train: .6, val: .2, pts: [], anim: 0, shuffled: false };
  function spInit(){ const r = rnd(3); sp.pts = Array.from({length: sp.n}, (_, i) => ({ i, r: r(), t: 0 })); sp.anim = 0; }
  function spDraw(){
    ctx.clearRect(0,0,W,H);
    sp.anim = Math.min(1, sp.anim + 0.02);
    const nT = Math.round(sp.n*sp.train), nV = Math.round(sp.n*sp.val);
    const cols = 20, cell = Math.min(W*0.75/cols, 34), rows = Math.ceil(sp.n/cols);
    const ox = (W - cols*cell)/2, oy = (H - rows*cell)/2 + 20;
    const zones = [
      { label: 'TRAIN — fit the model', color: '#2dd4bf', from: 0, to: nT },
      { label: 'VALIDATION — pick hyper-params', color: '#fbbf24', from: nT, to: nT+nV },
      { label: 'TEST — touch ONCE at the end', color: '#fb7185', from: nT+nV, to: sp.n },
    ];
    sp.pts.forEach((p, idx) => {
      const i = sp.shuffled ? Math.floor(p.r * sp.n) % sp.n : idx;
      const zone = zones.find(z => idx >= z.from && idx < z.to);
      const x = ox + (idx % cols)*cell + cell/2, y = oy + Math.floor(idx/cols)*cell + cell/2;
      const appear = Math.min(1, Math.max(0, sp.anim*3 - idx/sp.n));
      ctx.globalAlpha = appear;
      ctx.fillStyle = zone.color; ctx.shadowColor = zone.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(x, y, cell*0.3, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    });
    // zone labels
    ctx.font = 'bold 13px JetBrains Mono, monospace'; ctx.textAlign = 'left';
    zones.forEach((z, i) => {
      const y = oy + rows*cell + 40 + i*26;
      ctx.fillStyle = z.color; ctx.beginPath(); ctx.arc(ox, y, 6, 0, 7); ctx.fill();
      ctx.fillStyle = '#cbd5e1'; ctx.fillText(z.label + '  (' + (z.to - z.from) + ' rows)', ox + 16, y + 4);
    });
    ctx.fillStyle = 'rgba(251,113,133,.9)'; ctx.font = '11px JetBrains Mono, monospace';
    ctx.fillText('⚠ statistics (μ, σ), feature selection, tuning: TRAIN ONLY — else leakage', ox, oy - 24);
    stats([['Total rows', sp.n], ['Train', Math.round(sp.train*100) + '%'], ['Val', Math.round(sp.val*100) + '%'], ['Test', Math.round((1-sp.train-sp.val)*100) + '%']]);
  }

  /* ============ MODULE 2: SCALING ============ */
  const sc = { pts: [], t: 0, target: 0 };
  function scInit(){
    const r = rnd(9); sc.pts = [];
    for (let i = 0; i < 90; i++) {
      // feature1: salary ~ N(70k, 15k), feature2: age ~ N(40, 12) → wildly different scales
      sc.pts.push({ x: 70000 + gauss(r)*15000, y: 40 + gauss(r)*12, c: i%2 });
    }
    sc.t = 0; sc.target = 0;
  }
  function scStats(){
    const mx = sc.pts.reduce((s,p)=>s+p.x,0)/sc.pts.length, my = sc.pts.reduce((s,p)=>s+p.y,0)/sc.pts.length;
    const sx = Math.sqrt(sc.pts.reduce((s,p)=>s+(p.x-mx)**2,0)/sc.pts.length), sy = Math.sqrt(sc.pts.reduce((s,p)=>s+(p.y-my)**2,0)/sc.pts.length);
    return {mx,my,sx,sy};
  }
  function scDraw(){
    ctx.clearRect(0,0,W,H);
    sc.t += (sc.target - sc.t)*0.06;
    const {mx,my,sx,sy} = scStats();
    const cx = W/2, cy = H/2, span = Math.min(W,H)*0.36;
    // axes
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx-span-40, cy); ctx.lineTo(cx+span+40, cy); ctx.moveTo(cx, cy-span-40); ctx.lineTo(cx, cy+span+40); ctx.stroke();
    ctx.font='11px JetBrains Mono, monospace'; ctx.fillStyle='#64748b'; ctx.textAlign='center';
    ctx.fillText(sc.t<0.5?'salary (₹) — huge scale':'z-scored salary', cx+span*0.7, cy+20);
    ctx.save(); ctx.translate(cx-18, cy-span*0.7); ctx.rotate(-Math.PI/2); ctx.fillText(sc.t<0.5?'age (yrs) — tiny scale':'z-scored age', 0, 0); ctx.restore();
    sc.pts.forEach(p => {
      // raw normalized-to-view coords (raw spread dominated by salary)
      const rawX = (p.x - mx)/(3.2*sx) * span * ( (3.2*sx) / (3.2*sx) ); // salary fills span
      const rawY = (p.y - my)/(3.2*sx) * span * 800; // age squashed relative to salary scale (visually flat)
      const zX = (p.x - mx)/sx/3.2*span, zY = (p.y - my)/sy/3.2*span;
      const x = cx + rawX + (zX-rawX)*sc.t;
      const y = cy - (Math.max(-span, Math.min(span, rawY)) + (zY-Math.max(-span, Math.min(span, rawY)))*sc.t);
      const col = p.c ? '#fbbf24' : '#2dd4bf';
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    });
    const lbl = sc.t < 0.5 ? 'RAW: one feature dominates distance' : 'STANDARDISED: features comparable';
    ctx.fillStyle = sc.t < 0.5 ? '#fb7185' : '#34d399'; ctx.font = 'bold 13px JetBrains Mono, monospace'; ctx.textAlign='center';
    ctx.fillText(lbl, cx, cy + span + 60);
    stats([['μ salary', Math.round(mx).toLocaleString()], ['σ salary', Math.round(sx).toLocaleString()], ['μ age', my.toFixed(1)], ['σ age', sy.toFixed(1)], ['State', sc.t>0.5?'z-scored':'raw']]);
  }

  /* ============ MODULE 3: IMBALANCE ============ */
  const im = { ratio: 0.08, thresh: 0.5, pts: [] };
  function imInit(){
    const r = rnd(21); im.pts = [];
    const n = 300, nPos = Math.max(6, Math.round(n*im.ratio));
    for (let i = 0; i < n - nPos; i++) im.pts.push({ score: Math.min(.98, Math.max(.02, 0.30 + gauss(r)*0.15)), y: 0 });
    for (let i = 0; i < nPos; i++) im.pts.push({ score: Math.min(.98, Math.max(.02, 0.68 + gauss(r)*0.16)), y: 1 });
  }
  function imDraw(){
    ctx.clearRect(0,0,W,H);
    const ox = W*0.12, ow = W*0.76, oy = H*0.18, oh = H*0.52;
    // histogram bins
    const bins = 40, hNeg = new Array(bins).fill(0), hPos = new Array(bins).fill(0);
    im.pts.forEach(p => { const b = Math.min(bins-1, Math.floor(p.score*bins)); (p.y ? hPos : hNeg)[b]++; });
    const maxH = Math.max(...hNeg, ...hPos, 1);
    for (let b = 0; b < bins; b++) {
      const x = ox + b/bins*ow, bw = ow/bins - 2;
      ctx.fillStyle = 'rgba(45,212,191,.55)';
      ctx.fillRect(x, oy + oh - hNeg[b]/maxH*oh, bw, hNeg[b]/maxH*oh);
      ctx.fillStyle = 'rgba(251,113,133,.75)';
      ctx.fillRect(x, oy + oh - hPos[b]/maxH*oh - 2, bw, hPos[b]/maxH*oh);
    }
    // threshold line
    const tx = ox + im.thresh*ow;
    ctx.strokeStyle = '#f8fafc'; ctx.setLineDash([8,6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tx, oy - 20); ctx.lineTo(tx, oy + oh + 10); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 12px JetBrains Mono, monospace'; ctx.textAlign = 'center';
    ctx.fillText('threshold = ' + im.thresh.toFixed(2), tx, oy - 30);
    ctx.font = '11px JetBrains Mono, monospace'; ctx.fillStyle = '#64748b';
    ctx.fillText('model score →', ox + ow/2, oy + oh + 30);
    // metrics
    let TP=0, FP=0, TN=0, FN=0;
    im.pts.forEach(p => { const pred = p.score >= im.thresh ? 1 : 0;
      if (pred && p.y) TP++; else if (pred && !p.y) FP++; else if (!pred && !p.y) TN++; else FN++; });
    const acc = (TP+TN)/im.pts.length, prec = TP+FP ? TP/(TP+FP) : 0, rec = TP+FN ? TP/(TP+FN) : 0;
    const f1 = prec+rec ? 2*prec*rec/(prec+rec) : 0;
    // confusion matrix drawing
    const cmX = W*0.30, cmY = oy + oh + 60, cs = Math.min(72, H*0.09);
    const cells = [[TP,'TP','#34d399'],[FN,'FN','#fb7185'],[FP,'FP','#fbbf24'],[TN,'TN','#38bdf8']];
    ctx.font = 'bold 13px JetBrains Mono, monospace';
    cells.forEach(([v, l, c], i) => {
      const x = cmX + (i%2)*cs*1.9, y = cmY + Math.floor(i/2)*cs;
      ctx.fillStyle = c + '22'; ctx.strokeStyle = c; ctx.lineWidth = 1.5;
      ctx.fillRect(x, y, cs*1.8, cs - 6); ctx.strokeRect(x, y, cs*1.8, cs - 6);
      ctx.fillStyle = c; ctx.textAlign = 'center';
      ctx.fillText(l + ' = ' + v, x + cs*0.9, y + cs/2);
    });
    // "always predict majority" baseline
    const baseAcc = (im.pts.length - im.pts.filter(p=>p.y).length)/im.pts.length;
    ctx.textAlign = 'left'; ctx.fillStyle = '#94a3b8'; ctx.font = '12px JetBrains Mono, monospace';
    ctx.fillText('"always say negative" accuracy = ' + (baseAcc*100).toFixed(1) + '%  ← accuracy is misleading!', cmX + cs*4.2, cmY + 18);
    ctx.fillStyle = acc > baseAcc ? '#34d399' : '#fb7185';
    ctx.fillText('model accuracy = ' + (acc*100).toFixed(1) + '%', cmX + cs*4.2, cmY + 40);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('precision = ' + (prec*100).toFixed(1) + '%   recall = ' + (rec*100).toFixed(1) + '%   F1 = ' + f1.toFixed(3), cmX + cs*4.2, cmY + 62);
    legend([['#fb7185','positive (rare) class'], ['#2dd4bf','negative class']]);
    stats([['Positives', im.pts.filter(p=>p.y).length + ' / ' + im.pts.length], ['Accuracy', (acc*100).toFixed(1)+'%'], ['Precision', (prec*100).toFixed(1)+'%'], ['Recall', (rec*100).toFixed(1)+'%'], ['F1', f1.toFixed(3)]]);
  }

  function legend(items){
    ctx.font = '12px JetBrains Mono, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    items.forEach(([c, t], i) => { const y = 90 + i*22;
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(W - 230, y, 5, 0, 7); ctx.fill();
      ctx.fillStyle = '#94a3b8'; ctx.fillText(t, W - 216, y); });
  }
  function stats(rows){ statsBody.innerHTML = rows.map(([k,v]) => '<div class="flex justify-between gap-6"><span class="text-slate-500">'+k+'</span><span class="text-teal-300 font-bold">'+v+'</span></div>').join(''); }

  const MODULES = {
    split: {
      title: 'DATA SPLITTING', desc: 'TRAIN · VALIDATE · TEST',
      explain: '<b class="text-slate-200">Never evaluate on data you trained on.</b> Train fits parameters, validation selects hyper-parameters, and the test set is a sealed envelope — opened once. Adjust the sliders to re-partition the dataset. Everything (scaling stats, feature choices) must be learned on <i>train only</i> to avoid leakage.',
      init: spInit, draw: spDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">Train fraction: <span id="tr-lbl" class="text-teal-300 font-bold">60%</span></label>' +
        '<input type="range" min="40" max="80" value="60" class="mt-1 mb-3" oninput="App.act(\'train\', this.value)">' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase">Validation fraction: <span id="va-lbl" class="text-teal-300 font-bold">20%</span></label>' +
        '<input type="range" min="5" max="30" value="20" class="mt-1" oninput="App.act(\'val\', this.value)">' +
        '<button onclick="App.act(\'replay\')" class="w-full mt-3 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Replay animation</button>'
    },
    scale: {
      title: 'STANDARDISATION', desc: "x′ = (x − μ) / σ",
      explain: '<b class="text-slate-200">Features live on wildly different scales</b> — salary (~70,000) vs age (~40). Distance-based and gradient-based methods get dominated by the big axis. Standardising re-centres each feature at 0 with unit variance. Crucially, μ and σ come from the <i>training set only</i>.',
      init: scInit, draw: scDraw,
      controls: '<button onclick="App.act(\'zscore\')" id="btn-z" class="btn-primary w-full py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Apply z-score</button>' +
        '<button onclick="App.act(\'raw\')" class="w-full mt-2 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Back to raw</button>' +
        '<button onclick="App.act(\'rescInit\')" class="w-full mt-2 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Resample data</button>'
    },
    imbalance: {
      title: 'CLASS IMBALANCE', desc: 'WHEN ACCURACY LIES',
      explain: '<b class="text-slate-200">With 8% positives, a dumb "always negative" model scores 92% accuracy.</b> Slide the decision threshold across the score distribution and watch precision / recall trade off in the confusion matrix. For rare classes, judge with precision, recall, F1 and PR curves — not accuracy.',
      init: imInit, draw: imDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">Positive class rate: <span id="ra-lbl" class="text-teal-300 font-bold">8%</span></label>' +
        '<input type="range" min="2" max="50" value="8" class="mt-1 mb-3" oninput="App.act(\'ratio\', this.value)">' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase">Decision threshold: <span id="th-lbl" class="text-teal-300 font-bold">0.50</span></label>' +
        '<input type="range" min="5" max="95" value="50" class="mt-1" oninput="App.act(\'thresh\', this.value)">'
    },
  };

  function act(what, val){
    if (what === 'train') { sp.train = +val/100; document.getElementById('tr-lbl').textContent = val + '%'; sp.val = Math.min(sp.val, 1 - sp.train - 0.05); }
    if (what === 'val') { sp.val = Math.min(+val/100, 0.95 - sp.train); document.getElementById('va-lbl').textContent = Math.round(sp.val*100) + '%'; }
    if (what === 'replay') sp.anim = 0;
    if (what === 'zscore') sc.target = 1;
    if (what === 'raw') sc.target = 0;
    if (what === 'rescInit') scInit();
    if (what === 'ratio') { im.ratio = +val/100; document.getElementById('ra-lbl').textContent = val + '%'; imInit(); }
    if (what === 'thresh') { im.thresh = +val/100; document.getElementById('th-lbl').textContent = im.thresh.toFixed(2); }
  }

  function load(m){
    mode = m;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById('nav-' + m).classList.add('active');
    const M = MODULES[m];
    hudTitle.textContent = M.title; hudDesc.textContent = M.desc;
    controls.innerHTML = '<div class="fade-in">' + M.controls + '</div>';
    explain.innerHTML = '<div class="fade-in">' + M.explain + '</div>';
    M.init();
  }
  function loop(){ frame++; if (mode) MODULES[mode].draw(); requestAnimationFrame(loop); }
  resize();
  return { load, act, start(){ load('split'); loop(); } };
})();
App.start();
</script>
</body>
</html>
