<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Lab 11 — Clustering: k-Means & EM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg-dark:#020617;--panel:rgba(15,23,42,.7);--border:rgba(255,255,255,.08);--accent:#2dd4bf}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:#e2e8f0;overflow:hidden}
.font-mono{font-family:'JetBrains Mono',monospace}
.glass{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 8px 32px 0 rgba(0,0,0,.5)}
input[type=range]{-webkit-appearance:none;background:transparent;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;background:var(--accent);border-radius:50%;margin-top:-5px;box-shadow:0 0 15px var(--accent)}
input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:#334155;border-radius:2px}
.nav-item{transition:all .3s;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:linear-gradient(90deg,rgba(45,212,191,.1),transparent);border-left:2px solid var(--accent);color:#fff}
.glow-text{text-shadow:0 0 30px rgba(45,212,191,.3)}
.btn-primary{background:linear-gradient(135deg,#0d9488,#0891b2);transition:all .3s}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.fade-in{animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="flex h-screen w-screen selection:bg-teal-500 selection:text-black">

<nav class="w-80 glass flex flex-col z-20 border-r border-white/5 flex-shrink-0">
  <div class="p-6 border-b border-white/5 bg-gradient-to-b from-white/5 to-transparent">
    <h1 class="text-xl font-black tracking-tight flex items-center gap-2 text-white">
      <i class="fa-solid fa-circle-nodes text-teal-400"></i>
      ML <span class="text-teal-400">Lab 11</span>
    </h1>
    <p class="text-[10px] font-mono text-slate-500 mt-2 uppercase tracking-widest pl-7">Clustering — k-Means &amp; EM</p>
  </div>
  <div class="flex-1 overflow-y-auto py-4 space-y-1">
    <button onclick="App.load('kmeans')" id="nav-kmeans" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-teal-400 transition-colors">1. k-Means Stepper</span>
        <i class="fa-solid fa-bullseye text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Assign → update → repeat</div>
    </button>
    <button onclick="App.load('elbow')" id="nav-elbow" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-amber-400 transition-colors">2. Choosing k</span>
        <i class="fa-solid fa-chart-line text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">The elbow &amp; bad inits</div>
    </button>
    <button onclick="App.load('gmm')" id="nav-gmm" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-purple-400 transition-colors">3. GMM &amp; EM</span>
        <i class="fa-solid fa-cloud text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Soft clusters, ellipses</div>
    </button>
  </div>
  <div id="explain" class="p-5 border-t border-white/5 text-[12px] leading-relaxed text-slate-400 max-h-52 overflow-y-auto"></div>
  <div id="controls" class="p-6 bg-black/40 border-t border-white/5 min-h-[160px]"></div>
</nav>

<main class="flex-1 relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-black to-black">
  <canvas id="viz" class="w-full h-full block"></canvas>
  <div class="absolute top-8 left-8 pointer-events-none z-10">
    <h2 id="hud-title" class="text-4xl font-black text-white tracking-tighter glow-text">INIT</h2>
    <div class="flex items-center gap-2 mt-2 bg-black/50 px-3 py-1.5 rounded-full border border-white/10 w-fit">
      <div class="h-2 w-2 rounded-full bg-teal-500 animate-pulse"></div>
      <span id="hud-desc" class="text-xs font-mono text-teal-200 tracking-wider">LOADING</span>
    </div>
  </div>
  <div class="absolute bottom-8 left-8 glass p-5 rounded-lg min-w-[250px] z-10 border-l-4 border-teal-500">
    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
      <i class="fa-solid fa-wave-square text-teal-400 text-xs"></i>
      <span class="text-xs font-bold text-slate-200 uppercase tracking-widest">Live Metrics</span>
    </div>
    <div id="stats-body" class="space-y-2 font-mono text-xs text-slate-300"></div>
  </div>
</main>

<script>
'use strict';
const App = (() => {
  const canvas = document.getElementById('viz'), ctx = canvas.getContext('2d');
  const hudTitle = document.getElementById('hud-title'), hudDesc = document.getElementById('hud-desc');
  const controls = document.getElementById('controls'), explain = document.getElementById('explain'), statsBody = document.getElementById('stats-body');
  let W, H, mode = null;
  function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  window.addEventListener('resize', resize);
  function rnd(seed){ let s=seed; return ()=> (s=(s*16807)%2147483647)/2147483647; }
  const COLS = ['#2dd4bf','#fbbf24','#fb7185','#38bdf8','#c084fc','#a3e635'];

  // gaussian blobs data (shared)
  let DATA = [];
  function makeBlobs(seed, k, n, spread){
    const r = rnd(seed); DATA=[];
    const cs = [];
    for(let c=0;c<k;c++) cs.push({ x: 0.18+r()*0.64, y: 0.2+r()*0.6 });
    for(let c=0;c<k;c++) for(let i=0;i<n;i++){
      let u=0; for(let j=0;j<4;j++) u+=r(); u=(u-2)/2;
      let v=0; for(let j=0;j<4;j++) v+=r(); v=(v-2)/2;
      DATA.push({ x: cs[c].x+u*spread, y: cs[c].y+v*spread });
    }
  }

  /* ============ MODULE 1: K-MEANS STEPPER ============ */
  const km = { k: 3, cents: [], assign: [], phase: 'init', iter: 0, moved: true, trail: [] };
  function kmInit(){
    makeBlobs(77, 3, 40, 0.09);
    kmSeed();
  }
  function kmSeed(){
    km.cents=[]; km.trail=[];
    for(let c=0;c<km.k;c++){ const p=DATA[Math.floor(Math.random()*DATA.length)]; km.cents.push({x:p.x, y:p.y}); }
    km.trail = km.cents.map(c=>[{...c}]);
    km.assign = new Array(DATA.length).fill(-1);
    km.phase='init'; km.iter=0; km.moved=true;
  }
  function kmAssign(){
    DATA.forEach((p,i)=>{
      let bd=1e9, bc=0;
      km.cents.forEach((c,ci)=>{ const d=(p.x-c.x)**2+(p.y-c.y)**2; if(d<bd){bd=d;bc=ci;} });
      km.assign[i]=bc;
    });
    km.phase='assigned';
  }
  function kmUpdate(){
    km.moved=false;
    km.cents.forEach((c,ci)=>{
      const mine = DATA.filter((p,i)=>km.assign[i]===ci);
      if (!mine.length) return;
      const nx = mine.reduce((s,p)=>s+p.x,0)/mine.length, ny = mine.reduce((s,p)=>s+p.y,0)/mine.length;
      if (Math.hypot(nx-c.x, ny-c.y)>1e-4) km.moved=true;
      c.x=nx; c.y=ny; km.trail[ci].push({x:nx,y:ny});
    });
    km.phase='updated'; km.iter++;
  }
  function kmInertia(){
    if (km.assign[0]===-1) return null;
    return DATA.reduce((s,p,i)=>{ const c=km.cents[km.assign[i]]; return s+(p.x-c.x)**2+(p.y-c.y)**2; }, 0);
  }
  function kmDraw(){
    ctx.clearRect(0,0,W,H);
    // points
    DATA.forEach((p,i)=>{
      const a = km.assign[i];
      ctx.fillStyle = a>=0 ? COLS[a%COLS.length] : 'rgba(148,163,184,.55)';
      ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 4, 0, 7); ctx.fill();
    });
    // centroid trails
    km.trail.forEach((tr,ci)=>{
      ctx.strokeStyle=COLS[ci%COLS.length]+'66'; ctx.lineWidth=1.5; ctx.beginPath();
      tr.forEach((c,i)=> i?ctx.lineTo(c.x*W,c.y*H):ctx.moveTo(c.x*W,c.y*H));
      ctx.stroke();
    });
    // centroids
    km.cents.forEach((c,ci)=>{
      ctx.fillStyle=COLS[ci%COLS.length]; ctx.shadowColor=COLS[ci%COLS.length]; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(c.x*W, c.y*H, 11, 0, 7); ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='#020617'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(c.x*W-5,c.y*H); ctx.lineTo(c.x*W+5,c.y*H); ctx.moveTo(c.x*W,c.y*H-5); ctx.lineTo(c.x*W,c.y*H+5); ctx.stroke();
    });
    const inertia = kmInertia();
    const next = km.phase==='init'?'ASSIGN points':(km.phase==='assigned'?'UPDATE centroids':(km.moved?'ASSIGN again':'CONVERGED ✓'));
    stats([['k', km.k], ['Iteration', km.iter], ['Phase', km.phase], ['Inertia (SSE)', inertia===null?'—':inertia.toFixed(3)], ['Next step', next]]);
  }

  /* ============ MODULE 2: ELBOW / K CHOICE ============ */
  const el = { curve: [], kPick: 3 };
  function runKmeans(k, seed){
    const r = rnd(seed);
    let cents=[]; for(let c=0;c<k;c++){ const p=DATA[Math.floor(r()*DATA.length)]; cents.push({x:p.x,y:p.y}); }
    let assign=new Array(DATA.length).fill(0);
    for(let it=0; it<30; it++){
      DATA.forEach((p,i)=>{ let bd=1e9,bc=0; cents.forEach((c,ci)=>{ const d=(p.x-c.x)**2+(p.y-c.y)**2; if(d<bd){bd=d;bc=ci;} }); assign[i]=bc; });
      cents.forEach((c,ci)=>{ const mine=DATA.filter((p,i)=>assign[i]===ci); if(mine.length){ c.x=mine.reduce((s,p)=>s+p.x,0)/mine.length; c.y=mine.reduce((s,p)=>s+p.y,0)/mine.length; } });
    }
    const sse = DATA.reduce((s,p,i)=>{ const c=cents[assign[i]]; return s+(p.x-c.x)**2+(p.y-c.y)**2; },0);
    return { cents, assign, sse };
  }
  function elInit(){
    makeBlobs(123, 4, 32, 0.075);
    el.curve=[];
    for(let k=1;k<=8;k++){
      let best=1e9; // best of 5 restarts
      for(let t=0;t<5;t++) best=Math.min(best, runKmeans(k, 1000+k*17+t*7).sse);
      el.curve.push(best);
    }
    el.res = runKmeans(el.kPick, 999);
  }
  function elDraw(){
    ctx.clearRect(0,0,W,H);
    // left: clustered scatter at kPick
    el.res.assign.forEach((a,i)=>{
      const p=DATA[i];
      ctx.fillStyle=COLS[a%COLS.length];
      ctx.beginPath(); ctx.arc(p.x*W*0.55+W*0.02, p.y*H, 4, 0, 7); ctx.fill();
    });
    el.res.cents.forEach((c,ci)=>{
      ctx.fillStyle=COLS[ci%COLS.length]; ctx.shadowColor=COLS[ci%COLS.length]; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.arc(c.x*W*0.55+W*0.02, c.y*H, 10, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    });
    // right: elbow curve
    const gx=W*0.63, gw=W*0.32, gy=H*0.18, gh=H*0.5;
    ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.strokeRect(gx,gy,gw,gh);
    const mx = el.curve[0];
    ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2.5; ctx.beginPath();
    el.curve.forEach((s,i)=>{ const X=gx+i/7*gw, Y=gy+gh-(s/mx)*gh*0.9; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.stroke();
    el.curve.forEach((s,i)=>{
      const X=gx+i/7*gw, Y=gy+gh-(s/mx)*gh*0.9;
      const pick = i+1===el.kPick;
      ctx.fillStyle = pick?'#f8fafc':'#fbbf24';
      ctx.beginPath(); ctx.arc(X,Y,pick?7:4,0,7); ctx.fill();
      ctx.fillStyle='#64748b'; ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='center';
      ctx.fillText(i+1, X, gy+gh+18);
    });
    ctx.fillStyle='#64748b'; ctx.font='12px JetBrains Mono, monospace'; ctx.textAlign='center';
    ctx.fillText('k →', gx+gw/2, gy+gh+38);
    ctx.save(); ctx.translate(gx-14, gy+gh/2); ctx.rotate(-Math.PI/2); ctx.fillText('inertia (SSE)', 0, 0); ctx.restore();
    ctx.fillText('inertia ALWAYS falls as k grows — look for the bend, not the bottom', gx+gw/2, gy-16);
    stats([['True blobs', 4], ['Your k', el.kPick], ['SSE at k', el.curve[el.kPick-1].toFixed(3)], ['Restarts used', '5 (k-means is init-sensitive)'], ['Rule', 'pick the elbow']]);
  }

  /* ============ MODULE 3: GMM / EM ============ */
  const gm = { k: 3, comps: [], resp: [], iter: 0, ll: null };
  function gmInit(){
    // stretched blobs so kmeans-style circles fail
    const r = rnd(55); DATA=[];
    const defs = [
      { cx:0.3, cy:0.35, sx:0.13, sy:0.035, th:0.6 },
      { cx:0.62, cy:0.6, sx:0.12, sy:0.04, th:-0.5 },
      { cx:0.55, cy:0.25, sx:0.05, sy:0.05, th:0 },
    ];
    defs.forEach(d=>{
      for(let i=0;i<45;i++){
        let u=0; for(let j=0;j<4;j++) u+=r(); u=(u-2)/1.2;
        let v=0; for(let j=0;j<4;j++) v+=r(); v=(v-2)/1.2;
        const x=u*d.sx, y=v*d.sy;
        DATA.push({ x: d.cx + x*Math.cos(d.th)-y*Math.sin(d.th), y: d.cy + x*Math.sin(d.th)+y*Math.cos(d.th) });
      }
    });
    gmSeed();
  }
  function gmSeed(){
    gm.comps=[];
    for(let c=0;c<gm.k;c++){
      const p=DATA[Math.floor(Math.random()*DATA.length)];
      gm.comps.push({ mx:p.x, my:p.y, sxx:0.01, syy:0.01, sxy:0, pi:1/gm.k });
    }
    gm.resp = DATA.map(()=> new Array(gm.k).fill(1/gm.k));
    gm.iter=0; gm.ll=null;
  }
  function gpdf(p, c){
    const det = c.sxx*c.syy - c.sxy*c.sxy;
    if (det<=1e-10) return 1e-10;
    const dx=p.x-c.mx, dy=p.y-c.my;
    const q = (c.syy*dx*dx - 2*c.sxy*dx*dy + c.sxx*dy*dy)/det;
    return Math.exp(-q/2)/(2*Math.PI*Math.sqrt(det));
  }
  function gmStep(){
    // E-step
    let ll=0;
    DATA.forEach((p,i)=>{
      const ws = gm.comps.map(c=> c.pi*gpdf(p,c));
      const s = ws.reduce((a,b)=>a+b,0)+1e-12;
      ll += Math.log(s);
      gm.resp[i] = ws.map(w=>w/s);
    });
    // M-step
    gm.comps.forEach((c,ci)=>{
      const Nk = DATA.reduce((s,p,i)=>s+gm.resp[i][ci],0)+1e-9;
      c.pi = Nk/DATA.length;
      c.mx = DATA.reduce((s,p,i)=>s+gm.resp[i][ci]*p.x,0)/Nk;
      c.my = DATA.reduce((s,p,i)=>s+gm.resp[i][ci]*p.y,0)/Nk;
      let sxx=0, syy=0, sxy=0;
      DATA.forEach((p,i)=>{ const dx=p.x-c.mx, dy=p.y-c.my, w=gm.resp[i][ci];
        sxx+=w*dx*dx; syy+=w*dy*dy; sxy+=w*dx*dy; });
      c.sxx=sxx/Nk+2e-5; c.syy=syy/Nk+2e-5; c.sxy=sxy/Nk;
    });
    gm.iter++; gm.ll=ll;
  }
  function hexBlend(resp){
    // blend cluster colors by responsibility
    let R=0,G=0,B=0;
    resp.forEach((w,ci)=>{
      const h=COLS[ci%COLS.length];
      R+=w*parseInt(h.slice(1,3),16); G+=w*parseInt(h.slice(3,5),16); B+=w*parseInt(h.slice(5,7),16);
    });
    return 'rgb('+Math.round(R)+','+Math.round(G)+','+Math.round(B)+')';
  }
  function gmDraw(){
    ctx.clearRect(0,0,W,H);
    // points blended by responsibility
    DATA.forEach((p,i)=>{
      ctx.fillStyle = hexBlend(gm.resp[i]);
      ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 4.2, 0, 7); ctx.fill();
    });
    // ellipses (1σ and 2σ) via eigen decomposition
    gm.comps.forEach((c,ci)=>{
      const tr=c.sxx+c.syy, det=c.sxx*c.syy-c.sxy*c.sxy;
      const l1=tr/2+Math.sqrt(Math.max(0,tr*tr/4-det)), l2=tr/2-Math.sqrt(Math.max(0,tr*tr/4-det));
      const th = Math.abs(c.sxy)>1e-9 ? Math.atan2(l1-c.sxx, c.sxy) : 0;
      [1,2].forEach(nsig=>{
        ctx.strokeStyle=COLS[ci%COLS.length]+(nsig===1?'DD':'55'); ctx.lineWidth=nsig===1?2.5:1.5;
        ctx.beginPath();
        ctx.ellipse(c.mx*W, c.my*H, nsig*Math.sqrt(Math.max(1e-9,l1))*W, nsig*Math.sqrt(Math.max(1e-9,l2))*W, th, 0, 7);
        ctx.stroke();
      });
      ctx.fillStyle=COLS[ci%COLS.length]; ctx.shadowColor=COLS[ci%COLS.length]; ctx.shadowBlur=14;
      ctx.beginPath(); ctx.arc(c.mx*W, c.my*H, 7, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    });
    ctx.font='12px JetBrains Mono, monospace'; ctx.fillStyle='#64748b'; ctx.textAlign='left';
    ctx.fillText('point colour = blend of responsibilities γ — soft membership, unlike k-means', 20, H-18);
    stats([['Components k', gm.k], ['EM iteration', gm.iter], ['Log-likelihood', gm.ll===null?'—':gm.ll.toFixed(1)], ['Mixing π', gm.comps.map(c=>c.pi.toFixed(2)).join(' / ')], ['vs k-means', 'ellipses, not circles']]);
  }

  function stats(rows){ statsBody.innerHTML = rows.map(([k,v]) => '<div class="flex justify-between gap-6"><span class="text-slate-500">'+k+'</span><span class="text-teal-300 font-bold">'+v+'</span></div>').join(''); }

  const MODULES = {
    kmeans: {
      title: 'k-MEANS', desc: 'LLOYD\'S TWO-STEP DANCE',
      explain: '<b class="text-slate-200">k-Means alternates two moves:</b> <b>Assign</b> — every point joins its nearest centroid; <b>Update</b> — each centroid teleports to the mean of its members. Each move can only lower the inertia (sum of squared distances), so it must converge... but only to a <i>local</i> optimum. Re-seed a few times and watch different endings.',
      init: kmInit, draw: kmDraw,
      controls: '<button onclick="App.act(\'kmStep\')" class="btn-primary w-full py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-forward-step mr-2"></i>Next step</button>' +
        '<div class="flex gap-2 mt-2">' +
        '<button onclick="App.act(\'kmRun\')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Run to convergence</button>' +
        '<button onclick="App.act(\'kmSeed\')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Re-seed centroids</button></div>' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase mt-3 block">k: <span id="km-k" class="text-teal-300 font-bold">3</span></label>' +
        '<input type="range" min="2" max="6" value="3" class="mt-1" oninput="App.act(\'kmK\', this.value)">'
    },
    elbow: {
      title: 'CHOOSING k', desc: 'THE ELBOW METHOD',
      explain: '<b class="text-slate-200">Inertia always decreases as k grows</b> (at k = n it hits zero — every point its own cluster!). So you can\'t just minimise it. Instead look for the <b>elbow</b>: the k after which extra clusters stop paying for themselves. This data has 4 true blobs — see the bend at 4? Each k here uses the best of 5 random restarts, because a single unlucky init can lie.',
      init: elInit, draw: elDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">Cluster with k: <span id="el-k" class="text-teal-300 font-bold">3</span></label>' +
        '<input type="range" min="1" max="8" value="3" class="mt-1 mb-3" oninput="App.act(\'elK\', this.value)">' +
        '<button onclick="App.act(\'elRerun\')" class="w-full py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Re-run with new init</button>'
    },
    gmm: {
      title: 'GMM + EM', desc: 'SOFT CLUSTERS, LEARNED SHAPES',
      explain: '<b class="text-slate-200">These stretched clusters break k-means\' circular worldview.</b> A Gaussian Mixture models each cluster as a full ellipse and each point gets <b>responsibilities</b> γ (soft membership — see blended colours at boundaries). <b>E-step:</b> compute γ from current Gaussians. <b>M-step:</b> re-fit means, covariances and weights using γ. Log-likelihood climbs every iteration — EM is k-means\' probabilistic big sibling.',
      init: gmInit, draw: gmDraw,
      controls: '<button onclick="App.act(\'gmStep\')" class="btn-primary w-full py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-forward-step mr-2"></i>One EM iteration</button>' +
        '<div class="flex gap-2 mt-2">' +
        '<button onclick="App.act(\'gmTen\')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">+10 iterations</button>' +
        '<button onclick="App.act(\'gmSeed\')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Re-seed</button></div>'
    },
  };

  function act(what, val){
    if (what==='kmStep'){
      if (km.phase==='init'||km.phase==='updated') kmAssign(); else kmUpdate();
    }
    if (what==='kmRun'){ for(let i=0;i<60;i++){ kmAssign(); kmUpdate(); if(!km.moved) break; } kmAssign(); }
    if (what==='kmSeed') kmSeed();
    if (what==='kmK'){ km.k=+val; document.getElementById('km-k').textContent=val; kmSeed(); }
    if (what==='elK'){ el.kPick=+val; document.getElementById('el-k').textContent=val; el.res=runKmeans(el.kPick, 999); }
    if (what==='elRerun'){ el.res=runKmeans(el.kPick, Math.floor(Math.random()*100000)); }
    if (what==='gmStep') gmStep();
    if (what==='gmTen') for(let i=0;i<10;i++) gmStep();
    if (what==='gmSeed') gmSeed();
  }

  function load(m){
    mode=m;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.getElementById('nav-'+m).classList.add('active');
    const M=MODULES[m];
    hudTitle.textContent=M.title; hudDesc.textContent=M.desc;
    controls.innerHTML='<div class="fade-in">'+M.controls+'</div>';
    explain.innerHTML='<div class="fade-in">'+M.explain+'</div>';
    M.init();
  }
  function loop(){ if (mode) MODULES[mode].draw(); requestAnimationFrame(loop); }
  resize();
  return { load, act, start(){ load('kmeans'); loop(); } };
})();
App.start();
</script>
</body>
</html>
