<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Lab 6 — Decision Trees</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg-dark:#020617;--panel:rgba(15,23,42,.7);--border:rgba(255,255,255,.08);--accent:#2dd4bf}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:#e2e8f0;overflow:hidden}
.font-mono{font-family:'JetBrains Mono',monospace}
.glass{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 8px 32px 0 rgba(0,0,0,.5)}
input[type=range]{-webkit-appearance:none;background:transparent;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;background:var(--accent);border-radius:50%;margin-top:-5px;box-shadow:0 0 15px var(--accent)}
input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:#334155;border-radius:2px}
.nav-item{transition:all .3s;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:linear-gradient(90deg,rgba(45,212,191,.1),transparent);border-left:2px solid var(--accent);color:#fff}
.glow-text{text-shadow:0 0 30px rgba(45,212,191,.3)}
.btn-primary{background:linear-gradient(135deg,#0d9488,#0891b2);transition:all .3s}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:6px 4px;font-size:10px;font-weight:700;border-radius:6px;background:rgba(255,255,255,.05);transition:all .2s;font-family:'JetBrains Mono',monospace}
.seg button.on{background:linear-gradient(135deg,#0d9488,#0891b2);color:#fff}
.fade-in{animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="flex h-screen w-screen selection:bg-teal-500 selection:text-black">

<nav class="w-80 glass flex flex-col z-20 border-r border-white/5 flex-shrink-0">
  <div class="p-6 border-b border-white/5 bg-gradient-to-b from-white/5 to-transparent">
    <h1 class="text-xl font-black tracking-tight flex items-center gap-2 text-white">
      <i class="fa-solid fa-sitemap text-teal-400"></i>
      ML <span class="text-teal-400">Lab 6</span>
    </h1>
    <p class="text-[10px] font-mono text-slate-500 mt-2 uppercase tracking-widest pl-7">Decision Trees</p>
  </div>
  <div class="flex-1 overflow-y-auto py-4 space-y-1">
    <button onclick="App.load('entropy')" id="nav-entropy" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-teal-400 transition-colors">1. Entropy</span>
        <i class="fa-solid fa-dice text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Measuring impurity</div>
    </button>
    <button onclick="App.load('gain')" id="nav-gain" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-amber-400 transition-colors">2. Information Gain</span>
        <i class="fa-solid fa-arrows-left-right text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Drag the split — maximise IG</div>
    </button>
    <button onclick="App.load('grow')" id="nav-grow" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-rose-400 transition-colors">3. Grow the Tree</span>
        <i class="fa-solid fa-seedling text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Depth, regions &amp; overfitting</div>
    </button>
  </div>
  <div id="explain" class="p-5 border-t border-white/5 text-[12px] leading-relaxed text-slate-400 max-h-52 overflow-y-auto"></div>
  <div id="controls" class="p-6 bg-black/40 border-t border-white/5 min-h-[160px]"></div>
</nav>

<main class="flex-1 relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-black to-black">
  <canvas id="viz" class="w-full h-full block"></canvas>
  <div class="absolute top-8 left-8 pointer-events-none z-10">
    <h2 id="hud-title" class="text-4xl font-black text-white tracking-tighter glow-text">INIT</h2>
    <div class="flex items-center gap-2 mt-2 bg-black/50 px-3 py-1.5 rounded-full border border-white/10 w-fit">
      <div class="h-2 w-2 rounded-full bg-teal-500 animate-pulse"></div>
      <span id="hud-desc" class="text-xs font-mono text-teal-200 tracking-wider">LOADING</span>
    </div>
  </div>
  <div class="absolute bottom-8 left-8 glass p-5 rounded-lg min-w-[250px] z-10 border-l-4 border-teal-500">
    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
      <i class="fa-solid fa-wave-square text-teal-400 text-xs"></i>
      <span class="text-xs font-bold text-slate-200 uppercase tracking-widest">Live Metrics</span>
    </div>
    <div id="stats-body" class="space-y-2 font-mono text-xs text-slate-300"></div>
  </div>
</main>

<script>
'use strict';
const App = (() => {
  const canvas = document.getElementById('viz'), ctx = canvas.getContext('2d');
  const hudTitle = document.getElementById('hud-title'), hudDesc = document.getElementById('hud-desc');
  const controls = document.getElementById('controls'), explain = document.getElementById('explain'), statsBody = document.getElementById('stats-body');
  let W, H, mode = null;
  function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  window.addEventListener('resize', resize);
  function rnd(seed){ let s=seed; return ()=> (s=(s*16807)%2147483647)/2147483647; }
  const log2 = x => Math.log(x)/Math.LN2;
  function entropy(pos, tot){ if (!tot) return 0; const p = pos/tot; if (p<=0||p>=1) return 0; return -p*log2(p)-(1-p)*log2(1-p); }

  /* ============ MODULE 1: ENTROPY ============ */
  const en = { p: 0.5 };
  function enDraw(){
    ctx.clearRect(0,0,W,H);
    // left: ball urn
    const n = 36, cols = 6, cell = Math.min(W*0.28/cols, H*0.4/6);
    const ox = W*0.10, oy = H*0.24;
    const nPos = Math.round(en.p*n);
    for (let i=0;i<n;i++){
      const col = i < nPos ? '#fbbf24' : '#2dd4bf';
      const x = ox + (i%cols)*cell + cell/2, y = oy + Math.floor(i/cols)*cell + cell/2;
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(x, y, cell*0.34, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    }
    ctx.font='12px JetBrains Mono, monospace'; ctx.fillStyle='#94a3b8'; ctx.textAlign='center';
    ctx.fillText('a node with '+nPos+' ⊕ and '+(n-nPos)+' ⊖', ox+cols*cell/2, oy+6*cell+30);
    // right: H(p) curve
    const gx=W*0.48, gw=W*0.42, gy=H*0.2, gh=H*0.52;
    ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.strokeRect(gx,gy,gw,gh);
    ctx.strokeStyle='#c084fc'; ctx.lineWidth=3; ctx.beginPath();
    for(let i=0;i<=200;i++){ const p=i/200; const X=gx+p*gw, Y=gy+gh-entropy(p*100,100)*gh*0.94; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
    ctx.stroke();
    const Hv = entropy(nPos, n);
    const mx = gx+en.p*gw, my = gy+gh-Hv*gh*0.94;
    ctx.fillStyle='#f8fafc'; ctx.beginPath(); ctx.arc(mx,my,8,0,7); ctx.fill();
    ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.moveTo(mx, gy+gh); ctx.lineTo(mx, my); ctx.moveTo(gx, my); ctx.lineTo(mx, my); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#64748b'; ctx.font='12px JetBrains Mono, monospace';
    ctx.fillText('p(⊕) →', gx+gw/2, gy+gh+24);
    ctx.save(); ctx.translate(gx-24, gy+gh/2); ctx.rotate(-Math.PI/2); ctx.fillText('H(S) bits', 0, 0); ctx.restore();
    ctx.fillText('H(S) = −p·log₂p − (1−p)·log₂(1−p)', gx+gw/2, gy-14);
    stats([['p(⊕)', en.p.toFixed(2)], ['H(S)', Hv.toFixed(4)+' bits'], ['State', Hv<0.1?'PURE — nothing to learn':Hv>0.97?'MAX CHAOS — 50/50':'mixed'], ['Goal of a split', 'reduce H fast']]);
  }

  /* ============ SHARED 2D DATASET ============ */
  let PTS = [];
  function makeData(seed){
    const r = rnd(seed||8); PTS = [];
    // two blobs + a diagonal band → interesting axis-aligned splits
    for(let i=0;i<40;i++) PTS.push({ x: 0.18+(r()-.5)*0.26, y: 0.30+(r()-.5)*0.42, c: 0 });
    for(let i=0;i<40;i++) PTS.push({ x: 0.62+(r()-.5)*0.30, y: 0.62+(r()-.5)*0.5, c: 1 });
    for(let i=0;i<14;i++) PTS.push({ x: 0.55+(r()-.5)*0.2, y: 0.22+(r()-.5)*0.2, c: 0 });
    // noise
    for(let i=0;i<7;i++) PTS.push({ x: r(), y: r(), c: r()>.5?1:0 });
    PTS.forEach(p=>{ p.x = Math.min(.97, Math.max(.03, p.x)); p.y = Math.min(.97, Math.max(.03, p.y)); });
  }

  /* ============ MODULE 2: INFORMATION GAIN ============ */
  const ig = { axis: 'x', t: 0.5, dragging: false };
  function igBest(){
    let best = { gain: -1, t: 0.5, axis: 'x' };
    ['x','y'].forEach(ax => {
      for (let i=1;i<60;i++){
        const t = i/60;
        const g = igGain(ax, t);
        if (g > best.gain) best = { gain: g, t, axis: ax };
      }
    });
    return best;
  }
  function igGain(axis, t){
    const L = PTS.filter(p=>p[axis]<=t), R = PTS.filter(p=>p[axis]>t);
    const Hp = entropy(PTS.filter(p=>p.c===1).length, PTS.length);
    const Hl = entropy(L.filter(p=>p.c===1).length, L.length);
    const Hr = entropy(R.filter(p=>p.c===1).length, R.length);
    return Hp - (L.length/PTS.length)*Hl - (R.length/PTS.length)*Hr;
  }
  function igInit(){ makeData(8); ig.axis='x'; ig.t=0.5; }
  function igDraw(){
    ctx.clearRect(0,0,W,H);
    const m = 0.06, vw = W*(1-2*m), vh = H*(1-2*m);
    const PX = x => W*m + x*vw, PY = y => H*m + y*vh;
    // halves shading by majority
    const L = PTS.filter(p=>p[ig.axis]<=ig.t), R = PTS.filter(p=>p[ig.axis]>ig.t);
    const majL = L.filter(p=>p.c===1).length > L.length/2, majR = R.filter(p=>p.c===1).length > R.length/2;
    const shade = (isRight, maj) => {
      ctx.fillStyle = maj ? 'rgba(251,191,36,.07)' : 'rgba(45,212,191,.07)';
      if (ig.axis==='x') ctx.fillRect(isRight?PX(ig.t):PX(0), PY(0), isRight?(PX(1)-PX(ig.t)):(PX(ig.t)-PX(0)), vh);
      else ctx.fillRect(PX(0), isRight?PY(ig.t):PY(0), vw, isRight?(PY(1)-PY(ig.t)):(PY(ig.t)-PY(0)));
    };
    shade(false, majL); shade(true, majR);
    // split line
    ctx.strokeStyle='#f8fafc'; ctx.lineWidth=3; ctx.setLineDash([10,7]); ctx.beginPath();
    if (ig.axis==='x'){ ctx.moveTo(PX(ig.t), PY(0)); ctx.lineTo(PX(ig.t), PY(1)); }
    else { ctx.moveTo(PX(0), PY(ig.t)); ctx.lineTo(PX(1), PY(ig.t)); }
    ctx.stroke(); ctx.setLineDash([]);
    PTS.forEach(p=>{
      const col=p.c?'#fbbf24':'#2dd4bf';
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(PX(p.x), PY(p.y), 5.5, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    });
    // entropy bars: parent, left, right
    const Hp = entropy(PTS.filter(p=>p.c===1).length, PTS.length);
    const Hl = entropy(L.filter(p=>p.c===1).length, L.length);
    const Hr = entropy(R.filter(p=>p.c===1).length, R.length);
    const gain = igGain(ig.axis, ig.t);
    const best = igBest();
    const bx = W-260, by = 96, bw2=180, bh=14;
    [['parent H', Hp, '#94a3b8'], ['left H', Hl, '#2dd4bf'], ['right H', Hr, '#fbbf24'], ['GAIN', gain, '#34d399']].forEach(([lab,v,col],i)=>{
      ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(bx, by+i*30, bw2, bh);
      ctx.fillStyle=col; ctx.fillRect(bx, by+i*30, Math.max(0,v)*bw2, bh);
      ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='left'; ctx.fillStyle='#cbd5e1';
      ctx.fillText(lab+' = '+v.toFixed(3), bx, by+i*30-5);
    });
    ctx.fillStyle='#64748b'; ctx.font='12px JetBrains Mono, monospace'; ctx.textAlign='left';
    ctx.fillText('drag anywhere to move the split · best IG = '+best.gain.toFixed(3)+' at '+best.axis+' ≤ '+best.t.toFixed(2), 20, H-18);
    stats([['Split', ig.axis+' ≤ '+ig.t.toFixed(2)], ['|left| / |right|', L.length+' / '+R.length], ['IG', gain.toFixed(4)], ['Best possible', best.gain.toFixed(4)], ['You found it?', Math.abs(gain-best.gain)<0.01?'YES ✓':'keep hunting']]);
  }
  canvas.addEventListener('mousedown', e=>{ if (mode==='gain') ig.dragging=true; });
  canvas.addEventListener('mouseup', ()=> ig.dragging=false);
  canvas.addEventListener('mousemove', e=>{
    if (mode!=='gain'||!ig.dragging) return;
    const rect=canvas.getBoundingClientRect(); const m=0.06;
    const nx=((e.clientX-rect.left)/W-m)/(1-2*m), ny=((e.clientY-rect.top)/H-m)/(1-2*m);
    ig.t = Math.min(.98, Math.max(.02, ig.axis==='x'?nx:ny));
  });

  /* ============ MODULE 3: GROW TREE ============ */
  const gr = { depth: 1, minLeaf: 3, tree: null, testPts: [] };
  function buildTree(pts, depth){
    const pos = pts.filter(p=>p.c===1).length;
    const H0 = entropy(pos, pts.length);
    const node = { n: pts.length, pos, pred: pos > pts.length/2 ? 1 : 0, H: H0 };
    if (depth <= 0 || H0 < 1e-9 || pts.length < 2*gr.minLeaf) return node;
    let best = null;
    ['x','y'].forEach(ax=>{
      const vals = [...new Set(pts.map(p=>p[ax]))].sort((a,b)=>a-b);
      for (let i=1;i<vals.length;i++){
        const t=(vals[i-1]+vals[i])/2;
        const L=pts.filter(p=>p[ax]<=t), R=pts.filter(p=>p[ax]>t);
        if (L.length<gr.minLeaf||R.length<gr.minLeaf) continue;
        const g = H0 - (L.length/pts.length)*entropy(L.filter(p=>p.c===1).length,L.length) - (R.length/pts.length)*entropy(R.filter(p=>p.c===1).length,R.length);
        if (!best || g>best.g) best={ g, ax, t, L, R };
      }
    });
    if (!best || best.g < 1e-6) return node;
    node.split = { ax: best.ax, t: best.t };
    node.left = buildTree(best.L, depth-1);
    node.right = buildTree(best.R, depth-1);
    return node;
  }
  function treePredict(node, x, y){
    while (node.split){ node = ( (node.split.ax==='x'?x:y) <= node.split.t ) ? node.left : node.right; }
    return node.pred;
  }
  function countLeaves(n){ return n.split ? countLeaves(n.left)+countLeaves(n.right) : 1; }
  function grInit(){
    makeData(8);
    const r = rnd(99); gr.testPts = [];
    // test points from same distribution
    for(let i=0;i<30;i++) gr.testPts.push({ x: 0.18+(r()-.5)*0.26, y: 0.30+(r()-.5)*0.42, c: 0 });
    for(let i=0;i<30;i++) gr.testPts.push({ x: 0.62+(r()-.5)*0.30, y: 0.62+(r()-.5)*0.5, c: 1 });
    for(let i=0;i<10;i++) gr.testPts.push({ x: 0.55+(r()-.5)*0.2, y: 0.22+(r()-.5)*0.2, c: 0 });
    for(let i=0;i<5;i++) gr.testPts.push({ x: r(), y: r(), c: r()>.5?1:0 });
    gr.testPts.forEach(p=>{ p.x=Math.min(.97,Math.max(.03,p.x)); p.y=Math.min(.97,Math.max(.03,p.y)); });
    gr.tree = buildTree(PTS, gr.depth);
  }
  function grDraw(){
    ctx.clearRect(0,0,W,H);
    const m=0.06, vw=W*(1-2*m), vh=H*(1-2*m);
    const PX=x=>W*m+x*vw, PY=y=>H*m+y*vh;
    // decision regions
    const res=100;
    for(let i=0;i<res;i++) for(let j=0;j<res;j++){
      const x=(i+.5)/res, y=(j+.5)/res;
      const c=treePredict(gr.tree, x, y);
      ctx.fillStyle = c ? 'rgba(251,191,36,.12)' : 'rgba(45,212,191,.12)';
      ctx.fillRect(PX(x)-vw/res/2, PY(y)-vh/res/2, vw/res+1, vh/res+1);
    }
    // draw split lines recursively
    function drawSplits(node, x0, x1, y0, y1){
      if (!node.split) return;
      ctx.strokeStyle='rgba(248,250,252,.5)'; ctx.lineWidth=1.4;
      ctx.beginPath();
      if (node.split.ax==='x'){ ctx.moveTo(PX(node.split.t), PY(y0)); ctx.lineTo(PX(node.split.t), PY(y1)); }
      else { ctx.moveTo(PX(x0), PY(node.split.t)); ctx.lineTo(PX(x1), PY(node.split.t)); }
      ctx.stroke();
      if (node.split.ax==='x'){ drawSplits(node.left, x0, node.split.t, y0, y1); drawSplits(node.right, node.split.t, x1, y0, y1); }
      else { drawSplits(node.left, x0, x1, y0, node.split.t); drawSplits(node.right, x0, x1, node.split.t, y1); }
    }
    drawSplits(gr.tree, 0, 1, 0, 1);
    PTS.forEach(p=>{
      const col=p.c?'#fbbf24':'#2dd4bf';
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=5;
      ctx.beginPath(); ctx.arc(PX(p.x), PY(p.y), 5, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    });
    let trAcc=0; PTS.forEach(p=>{ if (treePredict(gr.tree,p.x,p.y)===p.c) trAcc++; }); trAcc/=PTS.length;
    let teAcc=0; gr.testPts.forEach(p=>{ if (treePredict(gr.tree,p.x,p.y)===p.c) teAcc++; }); teAcc/=gr.testPts.length;
    const leaves = countLeaves(gr.tree);
    stats([['Max depth', gr.depth], ['Leaves', leaves], ['Train acc', (trAcc*100).toFixed(1)+'%'], ['Test acc', (teAcc*100).toFixed(1)+'%'], ['Gap', ((trAcc-teAcc)*100).toFixed(1)+'% '+(trAcc-teAcc>0.1?'⚠ overfit':'✓')]]);
  }

  function stats(rows){ statsBody.innerHTML = rows.map(([k,v]) => '<div class="flex justify-between gap-6"><span class="text-slate-500">'+k+'</span><span class="text-teal-300 font-bold">'+v+'</span></div>').join(''); }

  const MODULES = {
    entropy: {
      title: 'ENTROPY', desc: 'H(S) = −Σ p log₂ p',
      explain: '<b class="text-slate-200">Entropy measures surprise.</b> A node that is all one class (p = 0 or 1) has H = 0 — nothing left to ask. A 50/50 node has H = 1 bit — maximum confusion. Slide the class mixture and watch the urn and the curve. Trees pick questions that push child nodes toward H = 0.',
      init: ()=>{}, draw: enDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">Fraction of ⊕: <span id="en-lbl" class="text-teal-300 font-bold">0.50</span></label>' +
        '<input type="range" min="0" max="100" value="50" class="mt-1" oninput="App.act(\'enP\', this.value)">'
    },
    gain: {
      title: 'INFORMATION GAIN', desc: 'IG = H(parent) − Σ w·H(child)',
      explain: '<b class="text-slate-200">You are the algorithm now.</b> Drag the white dashed line to place a split. IG (green bar) is the entropy destroyed by your question. Toggle the axis, hunt for the split that maximises IG — this greedy choice, applied recursively, is exactly ID3/C4.5.',
      init: igInit, draw: igDraw,
      controls: '<div class="seg mb-3">' +
        '<button id="ax-x" class="on" onclick="App.act(\'igAxis\',\'x\')">SPLIT ON X</button>' +
        '<button id="ax-y" onclick="App.act(\'igAxis\',\'y\')">SPLIT ON Y</button></div>' +
        '<button onclick="App.act(\'igBest\')" class="btn-primary w-full py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-bolt mr-2"></i>Reveal best split</button>' +
        '<button onclick="App.act(\'igNew\')" class="w-full mt-2 py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">New dataset</button>'
    },
    grow: {
      title: 'GROW THE TREE', desc: 'RECURSIVE SPLITS → REGIONS',
      explain: '<b class="text-slate-200">Every path from root to leaf carves an axis-aligned rectangle.</b> Raise the depth: the tree keeps splitting greedily, chasing every noisy point. Train accuracy marches to 100% while test accuracy stalls or drops — the case for pre-pruning (max depth, min leaf size) and post-pruning.',
      init: grInit, draw: grDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">Max depth: <span id="gr-lbl" class="text-teal-300 font-bold">1</span></label>' +
        '<input type="range" min="1" max="12" value="1" class="mt-1 mb-3" oninput="App.act(\'grDepth\', this.value)">' +
        '<label class="text-[11px] font-mono text-slate-400 uppercase">Min samples per leaf: <span id="gr-ml" class="text-teal-300 font-bold">3</span></label>' +
        '<input type="range" min="1" max="15" value="3" class="mt-1" oninput="App.act(\'grLeaf\', this.value)">'
    },
  };

  function act(what, val){
    if (what==='enP'){ en.p=+val/100; document.getElementById('en-lbl').textContent=en.p.toFixed(2); }
    if (what==='igAxis'){ ig.axis=val; document.getElementById('ax-x').classList.toggle('on', val==='x'); document.getElementById('ax-y').classList.toggle('on', val==='y'); }
    if (what==='igBest'){ const b=igBest(); ig.axis=b.axis; ig.t=b.t; document.getElementById('ax-x').classList.toggle('on', b.axis==='x'); document.getElementById('ax-y').classList.toggle('on', b.axis==='y'); }
    if (what==='igNew') makeData(Math.floor(Math.random()*10000)+3);
    if (what==='grDepth'){ gr.depth=+val; document.getElementById('gr-lbl').textContent=val; gr.tree=buildTree(PTS, gr.depth); }
    if (what==='grLeaf'){ gr.minLeaf=+val; document.getElementById('gr-ml').textContent=val; gr.tree=buildTree(PTS, gr.depth); }
  }

  function load(m){
    mode=m;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.getElementById('nav-'+m).classList.add('active');
    const M=MODULES[m];
    hudTitle.textContent=M.title; hudDesc.textContent=M.desc;
    controls.innerHTML='<div class="fade-in">'+M.controls+'</div>';
    explain.innerHTML='<div class="fade-in">'+M.explain+'</div>';
    M.init();
  }
  function loop(){ if (mode) MODULES[mode].draw(); requestAnimationFrame(loop); }
  resize();
  return { load, act, start(){ load('entropy'); loop(); } };
})();
App.start();
</script>
</body>
</html>
