<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Lab 7 — k-NN & Locally Weighted Regression</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg-dark:#020617;--panel:rgba(15,23,42,.7);--border:rgba(255,255,255,.08);--accent:#2dd4bf}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:#e2e8f0;overflow:hidden}
.font-mono{font-family:'JetBrains Mono',monospace}
.glass{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 8px 32px 0 rgba(0,0,0,.5)}
input[type=range]{-webkit-appearance:none;background:transparent;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;background:var(--accent);border-radius:50%;margin-top:-5px;box-shadow:0 0 15px var(--accent)}
input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:#334155;border-radius:2px}
.nav-item{transition:all .3s;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:linear-gradient(90deg,rgba(45,212,191,.1),transparent);border-left:2px solid var(--accent);color:#fff}
.glow-text{text-shadow:0 0 30px rgba(45,212,191,.3)}
.btn-primary{background:linear-gradient(135deg,#0d9488,#0891b2);transition:all .3s}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.fade-in{animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="flex h-screen w-screen selection:bg-teal-500 selection:text-black">

<nav class="w-80 glass flex flex-col z-20 border-r border-white/5 flex-shrink-0">
  <div class="p-6 border-b border-white/5 bg-gradient-to-b from-white/5 to-transparent">
    <h1 class="text-xl font-black tracking-tight flex items-center gap-2 text-white">
      <i class="fa-solid fa-people-arrows text-teal-400"></i>
      ML <span class="text-teal-400">Lab 7</span>
    </h1>
    <p class="text-[10px] font-mono text-slate-500 mt-2 uppercase tracking-widest pl-7">Instance-Based Learning</p>
  </div>
  <div class="flex-1 overflow-y-auto py-4 space-y-1">
    <button onclick="App.load('vote')" id="nav-vote" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-teal-400 transition-colors">1. The k-NN Vote</span>
        <i class="fa-solid fa-check-to-slot text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Move your mouse — neighbours vote</div>
    </button>
    <button onclick="App.load('regions')" id="nav-regions" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-amber-400 transition-colors">2. Decision Regions</span>
        <i class="fa-solid fa-map text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Small k jagged · large k smooth</div>
    </button>
    <button onclick="App.load('lwr')" id="nav-lwr" class="nav-item w-full text-left px-6 py-4 group">
      <div class="flex items-center justify-between">
        <span class="font-bold text-sm group-hover:text-rose-400 transition-colors">3. Locally Weighted Reg.</span>
        <i class="fa-solid fa-magnet text-slate-600 text-xs"></i>
      </div>
      <div class="text-[11px] text-slate-500 mt-1">Kernel weights &amp; bandwidth τ</div>
    </button>
  </div>
  <div id="explain" class="p-5 border-t border-white/5 text-[12px] leading-relaxed text-slate-400 max-h-52 overflow-y-auto"></div>
  <div id="controls" class="p-6 bg-black/40 border-t border-white/5 min-h-[160px]"></div>
</nav>

<main class="flex-1 relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-black to-black">
  <canvas id="viz" class="w-full h-full block"></canvas>
  <div class="absolute top-8 left-8 pointer-events-none z-10">
    <h2 id="hud-title" class="text-4xl font-black text-white tracking-tighter glow-text">INIT</h2>
    <div class="flex items-center gap-2 mt-2 bg-black/50 px-3 py-1.5 rounded-full border border-white/10 w-fit">
      <div class="h-2 w-2 rounded-full bg-teal-500 animate-pulse"></div>
      <span id="hud-desc" class="text-xs font-mono text-teal-200 tracking-wider">LOADING</span>
    </div>
  </div>
  <div class="absolute bottom-8 left-8 glass p-5 rounded-lg min-w-[250px] z-10 border-l-4 border-teal-500">
    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
      <i class="fa-solid fa-wave-square text-teal-400 text-xs"></i>
      <span class="text-xs font-bold text-slate-200 uppercase tracking-widest">Live Metrics</span>
    </div>
    <div id="stats-body" class="space-y-2 font-mono text-xs text-slate-300"></div>
  </div>
</main>

<script>
'use strict';
const App = (() => {
  const canvas = document.getElementById('viz'), ctx = canvas.getContext('2d');
  const hudTitle = document.getElementById('hud-title'), hudDesc = document.getElementById('hud-desc');
  const controls = document.getElementById('controls'), explain = document.getElementById('explain'), statsBody = document.getElementById('stats-body');
  let W, H, mode = null, mouse = { x: 0.5, y: 0.5 };
  function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  window.addEventListener('resize', resize);
  canvas.addEventListener('mousemove', e=>{ const r=canvas.getBoundingClientRect(); mouse={ x:(e.clientX-r.left)/W, y:(e.clientY-r.top)/H }; });
  function rnd(seed){ let s=seed; return ()=> (s=(s*16807)%2147483647)/2147483647; }

  let PTS = [];
  function makeData(seed){
    const r = rnd(seed||17); PTS=[];
    for(let i=0;i<35;i++) PTS.push({ x: 0.28+(r()-.5)*0.4, y: 0.35+(r()-.5)*0.45, c: 0 });
    for(let i=0;i<35;i++) PTS.push({ x: 0.68+(r()-.5)*0.4, y: 0.62+(r()-.5)*0.45, c: 1 });
    for(let i=0;i<8;i++) PTS.push({ x: r(), y: r(), c: r()>.5?1:0 });
    PTS.forEach(p=>{ p.x=Math.min(.97,Math.max(.03,p.x)); p.y=Math.min(.97,Math.max(.03,p.y)); });
  }
  function knn(x, y, k){
    return PTS.map(p=>({ p, d: Math.hypot(p.x-x, p.y-y) })).sort((a,b)=>a.d-b.d).slice(0, k);
  }

  /* ============ MODULE 1: VOTE ============ */
  const vo = { k: 5 };
  function voDraw(){
    ctx.clearRect(0,0,W,H);
    const near = knn(mouse.x, mouse.y, vo.k);
    // radius circle to kth
    const rad = near[near.length-1].d;
    ctx.strokeStyle='rgba(248,250,252,.28)'; ctx.setLineDash([6,6]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(mouse.x*W, mouse.y*H, rad*Math.min(W,H), 0, 7); ctx.stroke(); ctx.setLineDash([]);
    // lines to neighbours
    near.forEach(({p})=>{
      ctx.strokeStyle = p.c ? 'rgba(251,191,36,.5)' : 'rgba(45,212,191,.5)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(mouse.x*W, mouse.y*H); ctx.lineTo(p.x*W, p.y*H); ctx.stroke();
    });
    PTS.forEach(p=>{
      const isN = near.some(n=>n.p===p);
      const col=p.c?'#fbbf24':'#2dd4bf';
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=isN?14:4;
      ctx.beginPath(); ctx.arc(p.x*W, p.y*H, isN?8:5, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    });
    const votes1 = near.filter(n=>n.p.c===1).length, votes0 = vo.k - votes1;
    const pred = votes1 > votes0 ? 1 : 0;
    // query point
    const qc = pred?'#fbbf24':'#2dd4bf';
    ctx.fillStyle='#f8fafc'; ctx.strokeStyle=qc; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(mouse.x*W, mouse.y*H, 10, 0, 7); ctx.fill(); ctx.stroke();
    // vote tally
    ctx.font='bold 13px JetBrains Mono, monospace'; ctx.textAlign='left';
    ctx.fillStyle='#2dd4bf'; ctx.fillText('class 0: '+'■'.repeat(votes0), W-240, 96);
    ctx.fillStyle='#fbbf24'; ctx.fillText('class 1: '+'■'.repeat(votes1), W-240, 120);
    stats([['k', vo.k], ['Votes 0 / 1', votes0+' / '+votes1], ['Prediction', 'class '+pred], ['kth distance', rad.toFixed(3)], ['Training', 'ZERO — lazy learner']]);
  }

  /* ============ MODULE 2: REGIONS ============ */
  const re = { k: 1, cachedK: -1, cachedSeed: -1, img: null, seedTick: 0 };
  function reDraw(){
    ctx.clearRect(0,0,W,H);
    const res = 88;
    if (re.cachedK !== re.k || re.cachedSeed !== re.seedTick || !re.img || re.img.w !== W){
      // compute region grid
      re.img = { w: W, grid: [] };
      for(let j=0;j<res;j++){ const row=[];
        for(let i=0;i<res;i++){
          const near = knn((i+.5)/res, (j+.5)/res, re.k);
          const v1 = near.filter(n=>n.p.c===1).length;
          row.push(v1/re.k);
        } re.img.grid.push(row);
      }
      re.cachedK = re.k; re.cachedSeed = re.seedTick;
    }
    for(let j=0;j<res;j++) for(let i=0;i<res;i++){
      const t = re.img.grid[j][i];
      ctx.fillStyle = t>0.5 ? 'rgba(251,191,36,'+(0.06+0.18*(t-0.5)*2)+')' : 'rgba(45,212,191,'+(0.06+0.18*(0.5-t)*2)+')';
      ctx.fillRect(i/res*W, j/res*H, W/res+1, H/res+1);
    }
    PTS.forEach(p=>{
      const col=p.c?'#fbbf24':'#2dd4bf';
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=5;
      ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 5.4, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    });
    // LOO accuracy
    let loo=0;
    PTS.forEach((p,idx)=>{
      const near = PTS.filter((_,i2)=>i2!==idx).map(q=>({q, d: Math.hypot(q.x-p.x,q.y-p.y)})).sort((a,b)=>a.d-b.d).slice(0,re.k);
      const v1 = near.filter(n=>n.q.c===1).length;
      if ((v1>re.k/2?1:0)===p.c) loo++;
    });
    stats([['k', re.k], ['Boundary', re.k<4?'jagged (low bias, high var)':re.k>25?'oversmooth (high bias)':'balanced'], ['LOO-CV acc', (loo/PTS.length*100).toFixed(1)+'%'], ['Rule', 'choose k by validation']]);
  }

  /* ============ MODULE 3: LWR ============ */
  const lw = { tau: 0.08, data: [] };
  function lwInit(){
    const r = rnd(23); lw.data = [];
    for(let i=0;i<38;i++){ const x=(i+r()*0.8)/38; lw.data.push({ x, y: 0.5+0.28*Math.sin(x*7.5)+0.08*Math.cos(x*23)+(r()-.5)*0.12 }); }
  }
  function lwFitAt(x0){
    // weighted linear regression around x0
    let sw=0, swx=0, swy=0, swxx=0, swxy=0;
    lw.data.forEach(p=>{
      const w = Math.exp(-((p.x-x0)**2)/(2*lw.tau*lw.tau));
      sw+=w; swx+=w*p.x; swy+=w*p.y; swxx+=w*p.x*p.x; swxy+=w*p.x*p.y;
    });
    const det = sw*swxx - swx*swx;
    if (Math.abs(det)<1e-12) return { a: swy/Math.max(1e-12,sw), b: 0 };
    const b = (sw*swxy - swx*swy)/det, a = (swy - b*swx)/Math.max(1e-12,sw);
    return { a, b };
  }
  function lwDraw(){
    ctx.clearRect(0,0,W,H);
    const PX=x=>W*0.08+x*(W*0.84), PY=y=>H*0.82-y*(H*0.6);
    const qx = Math.min(.99, Math.max(0.01, (mouse.x*W - W*0.08)/(W*0.84)));
    // kernel weights as vertical bars at bottom
    lw.data.forEach(p=>{
      const w = Math.exp(-((p.x-qx)**2)/(2*lw.tau*lw.tau));
      ctx.fillStyle='rgba(192,132,252,'+(0.15+0.5*w)+')';
      ctx.fillRect(PX(p.x)-3, H*0.9, 6, -w*H*0.06);
    });
    ctx.fillStyle='#64748b'; ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='left';
    ctx.fillText('kernel weights w(x) = exp(−(x−x₀)²/2τ²)', W*0.08, H*0.955);
    // full LWR curve
    ctx.strokeStyle='#2dd4bf'; ctx.lineWidth=2.6; ctx.beginPath();
    for(let i=0;i<=140;i++){ const x=i/140; const f=lwFitAt(x); const y=f.a+f.b*x;
      const X=PX(x), Y=PY(Math.min(1.05,Math.max(-0.05,y))); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
    ctx.stroke();
    // local line at query
    const f0 = lwFitAt(qx);
    ctx.strokeStyle='rgba(251,113,133,.9)'; ctx.lineWidth=2; ctx.setLineDash([7,5]); ctx.beginPath();
    const x1=Math.max(0,qx-0.16), x2=Math.min(1,qx+0.16);
    ctx.moveTo(PX(x1), PY(f0.a+f0.b*x1)); ctx.lineTo(PX(x2), PY(f0.a+f0.b*x2)); ctx.stroke(); ctx.setLineDash([]);
    // data points sized by weight
    lw.data.forEach(p=>{
      const w = Math.exp(-((p.x-qx)**2)/(2*lw.tau*lw.tau));
      ctx.fillStyle='#f8fafc'; ctx.globalAlpha=0.35+0.65*w;
      ctx.beginPath(); ctx.arc(PX(p.x), PY(p.y), 3.6+4*w, 0, 7); ctx.fill(); ctx.globalAlpha=1;
    });
    // query marker
    ctx.fillStyle='#fb7185'; ctx.shadowColor='#fb7185'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(PX(qx), PY(f0.a+f0.b*qx), 8, 0, 7); ctx.fill(); ctx.shadowBlur=0;
    ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(251,113,133,.3)';
    ctx.beginPath(); ctx.moveTo(PX(qx), PY(f0.a+f0.b*qx)); ctx.lineTo(PX(qx), H*0.9); ctx.stroke(); ctx.setLineDash([]);
    stats([['Query x₀', qx.toFixed(3)], ['ŷ(x₀)', (f0.a+f0.b*qx).toFixed(3)], ['τ (bandwidth)', lw.tau.toFixed(3)], ['Behaviour', lw.tau<0.04?'very local — wiggly':lw.tau>0.2?'nearly global — like OLS':'smooth local fit']]);
  }

  function stats(rows){ statsBody.innerHTML = rows.map(([k,v]) => '<div class="flex justify-between gap-6"><span class="text-slate-500">'+k+'</span><span class="text-teal-300 font-bold">'+v+'</span></div>').join(''); }

  const MODULES = {
    vote: {
      title: 'THE k-NN VOTE', desc: 'NO TRAINING — JUST NEIGHBOURS',
      explain: '<b class="text-slate-200">Your mouse is the query point.</b> The k nearest stored examples light up and vote; majority wins (white ring takes the winner\'s colour). k-NN never "trains" — it memorises the data and defers all work to prediction time. Distance is everything, so features must share a scale.',
      init: ()=>makeData(17), draw: voDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">k neighbours: <span id="vo-lbl" class="text-teal-300 font-bold">5</span></label>' +
        '<input type="range" min="1" max="25" step="2" value="5" class="mt-1 mb-3" oninput="App.act(\'voK\', this.value)">' +
        '<button onclick="App.act(\'newData\')" class="w-full py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">New dataset</button>'
    },
    regions: {
      title: 'DECISION REGIONS', desc: 'k CONTROLS SMOOTHNESS',
      explain: '<b class="text-slate-200">The whole plane, coloured by the k-NN verdict.</b> k = 1 traces every noisy point (a Voronoi mosaic — zero training error, high variance). Large k averages over many neighbours — smooth but potentially blurred boundaries (high bias). The leave-one-out CV accuracy helps pick k.',
      init: ()=>{ makeData(17); re.cachedK=-1; }, draw: reDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">k neighbours: <span id="re-lbl" class="text-teal-300 font-bold">1</span></label>' +
        '<input type="range" min="1" max="35" step="2" value="1" class="mt-1 mb-3" oninput="App.act(\'reK\', this.value)">' +
        '<button onclick="App.act(\'newData2\')" class="w-full py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">New dataset</button>'
    },
    lwr: {
      title: 'LOCALLY WEIGHTED', desc: 'FIT A LINE NEAR THE QUERY',
      explain: '<b class="text-slate-200">Move your mouse along x.</b> Every training point gets a Gaussian kernel weight (purple bars); a small weighted linear regression is solved <i>fresh at the query</i> (pink dashed line). The teal curve strings those local predictions together. τ sets the neighbourhood width — small τ hugs noise, large τ approaches plain OLS.',
      init: lwInit, draw: lwDraw,
      controls: '<label class="text-[11px] font-mono text-slate-400 uppercase">Bandwidth τ: <span id="lw-lbl" class="text-teal-300 font-bold">0.080</span></label>' +
        '<input type="range" min="15" max="300" value="80" class="mt-1 mb-3" oninput="App.act(\'lwTau\', this.value)">' +
        '<button onclick="App.act(\'newLwr\')" class="w-full py-2 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 transition">Resample data</button>'
    },
  };

  function act(what, val){
    if (what==='voK'){ vo.k=+val; document.getElementById('vo-lbl').textContent=val; }
    if (what==='newData'){ makeData(Math.floor(Math.random()*100000)+11); }
    if (what==='reK'){ re.k=+val; document.getElementById('re-lbl').textContent=val; }
    if (what==='newData2'){ makeData(Math.floor(Math.random()*100000)+11); re.seedTick++; }
    if (what==='lwTau'){ lw.tau=+val/1000; document.getElementById('lw-lbl').textContent=lw.tau.toFixed(3); }
    if (what==='newLwr') lwInit();
  }

  function load(m){
    mode=m;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.getElementById('nav-'+m).classList.add('active');
    const M=MODULES[m];
    hudTitle.textContent=M.title; hudDesc.textContent=M.desc;
    controls.innerHTML='<div class="fade-in">'+M.controls+'</div>';
    explain.innerHTML='<div class="fade-in">'+M.explain+'</div>';
    M.init();
  }
  function loop(){ if (mode) MODULES[mode].draw(); requestAnimationFrame(loop); }
  resize();
  return { load, act, start(){ load('vote'); loop(); } };
})();
App.start();
</script>
</body>
</html>
